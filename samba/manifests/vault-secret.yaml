# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: samba
spec:
  type: kv-v2
  mount: secret
  path: samba/smigorx
  refreshAfter: 1h
  destination:
    name: samba-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
