# Traefik HelmChartConfig – overrides for the k3s-managed Traefik deployment.
#
# k3s installs Traefik via a HelmChart resource in kube-system. To tweak its
# values without touching the k3s-managed manifest, you create a
# HelmChartConfig with the same name ("traefik") in the same namespace.
# k3s merges these values into its own Helm release on the next reconcile.
#
# This is the only source for that object. It used to have a twin: a k3s addon,
# /var/lib/rancher/k3s/server/manifests/traefk-config.yaml (sic) on the host,
# wrote the same HelmChartConfig with only the MetalLB annotation, and every
# time either side applied it the other's settings vanished - the Traefik
# release reached revision 28 that way, and whenever this file won, the Service
# lost its address request. Both settings now live here, and the host file is
# gone. Do not recreate it: anything under that directory is applied on every
# k3s start and overwrites this object.
#
# Two settings:
#
# 1. respondingTimeouts on the "websecure" entrypoint, 10 minutes. Traefik's
#    defaults (60 s in some builds, 0 in others, and a 180 s idleTimeout) reset
#    large Immich video uploads mid-transfer.
#
# 2. The Service's MetalLB address. The ingress pool has autoAssign: false, so
#    without metallb.io/loadBalancerIPs a recreated Service gets no address at
#    all, and every HTTP route in the cluster goes with it. 192.168.1.11 is
#    what the wildcard DNS record points at.
#
# Docs:
#   https://docs.k3s.io/helm#customizing-packaged-components-with-helmchartconfig
#   https://doc.traefik.io/traefik/routing/entrypoints/#respondingtimeouts
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600
            writeTimeout: 600
            idleTimeout: 180
    service:
      annotations:
        metallb.io/address-pool: ingress
        metallb.io/loadBalancerIPs: "192.168.1.11"
