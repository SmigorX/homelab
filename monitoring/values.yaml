# Overrides only; the chart's own values.yaml is the reference. See README.md
# for why this is VictoriaMetrics rather than kube-prometheus-stack, and for the
# resource budget every request below is sized against.

# Short names: vmks-grafana, vmsingle-vmks, ... instead of the chart name
# repeated into every object.
fullnameOverride: vmks

# Argo CD renders with `releaseName: vmks`; the chart's scrape selectors key on
# the release name, and this keeps them pointed at the right objects.
argocdReleaseOverride: vmks

victoria-metrics-operator:
  # The validating webhook's certificate is generated by Helm at render time.
  # Argo CD renders on every refresh, so the Secret and the webhook's caBundle
  # would differ on every comparison and the app would never settle Synced.
  # Validation only catches malformed CRs earlier than the operator would.
  admissionWebhooks:
    enabled: false

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# --- Storage and collection -------------------------------------------------

vmsingle:
  spec:
    retentionPeriod: 30d

    # Explicit for the same reason as everywhere else in this repo: left out,
    # the claim falls through to k3s's built-in local-path class, which is
    # node-local and reclaimPolicy Delete.
    storage:
      storageClassName: local-path-core
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 1Gi

vmagent:
  spec:
    scrapeInterval: 30s

    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 384Mi

vmalert:
  spec:
    resources:
      requests:
        cpu: 20m
        memory: 48Mi
      limits:
        memory: 192Mi

# --- k3s ---------------------------------------------------------------------
#
# k3s runs the API server, controller manager, scheduler, kube-proxy, kubelet
# and kine (its SQLite shim standing in for etcd) as one process with one
# Prometheus registry. Every metrics endpoint it has serves all of them: the
# API server's /metrics already carries scheduler_*, workqueue_* (the
# controller manager), kubeproxy_* and kine_*. Nothing is missing here; it is
# all under job="apiserver" in Grafana's Explore.
#
# So the four dedicated scrapes stay off. Their own endpoints are bound to
# localhost (k3s flags such as --kube-scheduler-arg=bind-address=0.0.0.0 would
# open them), but each would only re-scrape the same ~51k series under another
# job label, and their "down" alerts mean nothing when a single process either
# runs all of them or none. KubeAPIDown already covers that. Disabling them also
# drops their dashboards, which filter on job="kube-scheduler" and the like.

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  groups:
    etcd:
      enabled: false

# The same shared registry means the kubelet's /metrics is a copy of the API
# server's: about 51k series, of which about 3k are the kubelet's own. Scraped
# as-is, VMSingle would store everything twice. Drop the families owned by the
# other components here, so they come only from the apiserver job. kubelet_*,
# storage_operation_*, rest_client_*, go_* and process_* stay, since those are
# what the kubelet dashboard and rules read.
#
# The list replaces the chart's default rather than appending to it, so the
# first three rules are the chart's, copied verbatim. vmScrape.spec is shared
# by the cadvisor and probes scrapes too. That is harmless here, because none
# of the dropped prefixes occur there.
kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: drop
          source_labels: [__name__]
          regex: (apiserver|apiextensions|aggregator|etcd|kine|scheduler|workqueue|kubeproxy|watch_cache|lasso)_.*

# --- Alerting ----------------------------------------------------------------

alertmanager:
  spec:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # The Discord webhook URL, synced from Vault by
    # manifests/vault-secret.yaml. Mounted explicitly rather than through
    # spec.secrets so the path the config below reads is written down here.
    volumes:
      - name: discord
        secret:
          secretName: alertmanager-discord
    volumeMounts:
      - name: discord
        mountPath: /etc/alertmanager/discord
        readOnly: true

  # The Slack templates; nothing here uses Slack.
  monzoTemplate:
    enabled: false

  config:
    route:
      # Anything not matched below goes nowhere. The default rules carry a
      # good number of severity=info alerts (CPU throttling, for one) that are
      # worth seeing in Grafana and not worth a notification.
      receiver: blackhole
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

      routes:
        - receiver: discord
          matchers:
            - severity=~"warning|critical"

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity="warning"
        target_matchers:
          - severity="info"
        equal: [namespace, alertname]

    receivers:
      - name: blackhole
      - name: discord
        discord_configs:
          # _file, not webhook_url: the URL is the whole credential, and this
          # block ends up in a Secret the operator renders from Git.
          - webhook_url_file: /etc/alertmanager/discord/webhook-url
            send_resolved: true

# --- Exporters ---------------------------------------------------------------

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi

# --- Logs --------------------------------------------------------------------
#
# VictoriaLogs, created by the same operator as VMSingle. The chart points
# VLAgent at it and adds it to Grafana as a datasource on its own; see
# README.md, "Logs".

vlsingle:
  enabled: true
  spec:
    retentionPeriod: 30d
    # A ceiling under the claim, so a log storm deletes the oldest days
    # instead of filling the volume.
    retentionMaxDiskSpaceUsageBytes: 8GiB

    storage:
      storageClassName: local-path-core
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

    # The limit is for queries: a wide search over many days is what grows
    # it, not ingestion, which is a few hundred lines a minute here.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi

# One pod per node (a DaemonSet), so one here.
vlagent:
  enabled: true
  spec:
    # Every container's stdout/stderr, from /var/log/pods, with namespace, pod
    # and container attached.
    k8sCollector:
      enabled: true

    # The host's own logs: k3s itself, systemd, sshd, dnf. They are in the
    # binary journal, which vlagent cannot read, but the host also runs
    # rsyslog, which writes them out as text. Mounted under /host so the path
    # cannot collide with whatever the operator mounts for k8sCollector.
    # /var/log/messages is ~100MB a week, almost all of it k3s.
    extraArgs:
      fileCollector.glob: /host/var/log/messages,/host/var/log/secure
    volumes:
      - name: host-var-log
        hostPath:
          path: /var/log
          type: Directory
    volumeMounts:
      - name: host-var-log
        mountPath: /host/var/log
        readOnly: true

    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 256Mi

# With both VMSingle and VLSingle present, the chart puts a small VMAuth in
# front of VMAlert's datasource: /select/logsql/ goes to VictoriaLogs, the rest
# to VMSingle, so rules can be written against logs too. It is one more hop
# for every rule evaluation, which is why it gets explicit, small resources
# rather than the operator's defaults.
internal:
  vmauth:
    spec:
      port: "8427"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

# The chart's entry, renamed from "VictoriaLogs (DS)". Keep the uid: anything
# saved against this datasource refers to it by uid.
defaultDatasources:
  victorialogs:
    datasources:
      - name: VictoriaLogs
        access: proxy
        uid: VictoriaLogs
        type: victoriametrics-logs-datasource
        plugin: true

# --- Grafana -----------------------------------------------------------------

# The chart's ~40 stock dashboards (Windows, AIX and Darwin nodes, multicluster,
# the components k3s does not split out) are off. The dashboards used here are
# hand-written for this cluster and live in manifests/dashboards/; see
# README.md. Turning this off does not delete the ConfigMaps the sync job
# already created, because the job loses its ConfigMap permissions with it.
# README.md has the one-off cleanup.
defaultDashboards:
  enabled: false

grafana:
  # Kept out of the chart's hands: left to itself it generates the admin
  # password with randAlphaNum, Argo CD re-renders it on every refresh, and the
  # Secret is permanently OutOfSync - the same trap forgejo/README.md describes.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # The datasource type for VictoriaLogs. Downloaded from grafana.com when the
  # pod starts, so a Grafana restart needs internet. The chart only adds the
  # VictoriaLogs datasource when its plugin is listed here.
  plugins:
    - victoriametrics-logs-datasource

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

  grafana.ini:
    server:
      root_url: https://grafana.k8s.internal.smigorx.eu

    auth:
      # Straight to Authentik. The local login form stays reachable at
      # /login?disableAutoLogin=true for the admin account above, which is the
      # way in when Authentik itself is what is broken.
      oauth_auto_login: true
      signout_redirect_url: https://auth.k8s.internal.smigorx.eu/application/o/grafana/end-session/

    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid profile email
      auth_url: https://auth.k8s.internal.smigorx.eu/application/o/authorize/
      token_url: https://auth.k8s.internal.smigorx.eu/application/o/token/
      api_url: https://auth.k8s.internal.smigorx.eu/application/o/userinfo/
      use_pkce: true
      # Authentik's profile scope carries a `groups` claim. The blueprint
      # already lets only authentik Admins through; strict mode is the second
      # lock - anyone who somehow arrives without that group maps to no role
      # and is refused rather than landing as a Viewer.
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin'
      role_attribute_strict: true
      allow_sign_up: true

    # Where the sidecar writes the `health.json` key of the homelab-dashboards
    # ConfigMap.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/health.json

  # Dashboards come from Git, but users, preferences and anything built by
  # hand in the UI live in Grafana's SQLite database.
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path-core
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Grafana
      gethomepage.dev/description: Metrics and dashboards
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/icon: grafana.png
    hosts:
      - grafana.k8s.internal.smigorx.eu
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.k8s.internal.smigorx.eu

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      memory: 512Mi

  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # Everything the sidecar loads, which is every ConfigMap in this namespace
    # labelled grafana_dashboard: "1", goes in one folder. Provisioned
    # dashboards cannot be saved from the UI. Edit, then export the JSON over
    # the file in manifests/dashboards/.
    dashboards:
      provider:
        folder: Homelab
