# Overrides only; the chart's own values.yaml is the reference. See README.md
# for why this is VictoriaMetrics rather than kube-prometheus-stack, and for the
# resource budget every request below is sized against.

# Short names: vmks-grafana, vmsingle-vmks, ... instead of the chart name
# repeated into every object.
fullnameOverride: vmks

# Argo CD renders with `releaseName: vmks`; the chart's scrape selectors key on
# the release name, and this keeps them pointed at the right objects.
argocdReleaseOverride: vmks

victoria-metrics-operator:
  # The validating webhook's certificate is generated by Helm at render time.
  # Argo CD renders on every refresh, so the Secret and the webhook's caBundle
  # would differ on every comparison and the app would never settle Synced.
  # Validation only catches malformed CRs earlier than the operator would.
  admissionWebhooks:
    enabled: false

  # ~63Mi steady, p99 ~80Mi (November 2026).
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi

# --- Storage and collection -------------------------------------------------

vmsingle:
  spec:
    retentionPeriod: 30d

    # Explicit for the same reason as everywhere else in this repo: left out,
    # the claim falls through to k3s's built-in local-path class, which is
    # node-local and reclaimPolicy Delete. local-path-ssd binds the
    # operator's claim to the static PV in manifests/ssd-volumes.yaml.
    storage:
      storageClassName: local-path-ssd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

    # Pinned while local-path volumes live on one node; see README.md, "Storage".
    nodeSelector:
      kubernetes.io/hostname: fedora-server

    # ~77m and ~625Mi steady, p99 ~720Mi, peak ~780Mi over 14 days
    # (November 2026). The old 192Mi request was a third of what it uses.
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi

vmagent:
  spec:
    scrapeInterval: 30s

    # ~32m and ~130Mi steady, p99 ~160Mi (November 2026).
    resources:
      requests:
        cpu: 40m
        memory: 160Mi
      limits:
        memory: 384Mi

vmalert:
  spec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi

# --- k3s ---------------------------------------------------------------------
#
# k3s runs the API server, controller manager, scheduler, kube-proxy, kubelet
# and kine (its SQLite shim standing in for etcd) as one process with one
# Prometheus registry. Every metrics endpoint it has serves all of them: the
# API server's /metrics already carries scheduler_*, workqueue_* (the
# controller manager), kubeproxy_* and kine_*. Nothing is missing here; it is
# all under job="apiserver" in Grafana's Explore.
#
# So the four dedicated scrapes stay off. Their own endpoints are bound to
# localhost (k3s flags such as --kube-scheduler-arg=bind-address=0.0.0.0 would
# open them), but each would only re-scrape the same ~51k series under another
# job label, and their "down" alerts mean nothing when a single process either
# runs all of them or none. KubeAPIDown already covers that. Disabling them also
# drops their dashboards, which filter on job="kube-scheduler" and the like.

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  groups:
    etcd:
      enabled: false
  # Both ask whether the cluster's requests would still fit with its largest
  # node gone. With two nodes, and everything stateful pinned to fedora-server
  # (its storage lives there), the answer is no by construction, so
  # KubeMemoryOvercommit fired around the clock and kept reposting to Discord -
  # which trains you to ignore the channel the disk alerts post to. The CPU one
  # is off for the same reason, before it starts. The question they ask per
  # node, will the next pod fit, is the Resources dashboard's budget row.
  #
  # The chart does not render these rules itself: vmks-sync-job fetches them
  # and creates the VMRules, honouring `enabled: false` per rule.
  rules:
    KubeMemoryOvercommit:
      enabled: false
    KubeCPUOvercommit:
      enabled: false

# The same shared registry means the kubelet's /metrics is a copy of the API
# server's: about 51k series, of which about 3k are the kubelet's own. Scraped
# as-is, VMSingle would store everything twice. Drop the families owned by the
# other components here, so they come only from the apiserver job. kubelet_*,
# storage_operation_*, rest_client_*, go_* and process_* stay, since those are
# what the kubelet dashboard and rules read.
#
# The list replaces the chart's default rather than appending to it, so the
# first three rules are the chart's, copied verbatim. vmScrape.spec is shared
# by the cadvisor and probes scrapes too. That is harmless here, because none
# of the dropped prefixes occur there.
kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        - action: labeldrop
          regex: (uid)
        - action: labeldrop
          regex: (id|name)
        - action: drop
          source_labels: [__name__]
          regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
        - action: drop
          source_labels: [__name__]
          regex: (apiserver|apiextensions|aggregator|etcd|kine|scheduler|workqueue|kubeproxy|watch_cache|lasso)_.*

# --- Alerting ----------------------------------------------------------------

alertmanager:
  spec:
    # What Alertmanager puts in the links it generates: its own UI, and the
    # silence links in notifications. Left empty it is the pod's address,
    # which nobody outside the cluster can open.
    externalURL: https://alertmanager.k8s.internal.smigorx.eu

    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

    # The Discord webhook URL, synced from Vault by
    # manifests/vault-secret.yaml. Mounted explicitly rather than through
    # spec.secrets so the path the config below reads is written down here.
    volumes:
      - name: discord
        secret:
          secretName: alertmanager-discord
    volumeMounts:
      - name: discord
        mountPath: /etc/alertmanager/discord
        readOnly: true

  # Alertmanager has no authentication of its own, and its UI can create and
  # expire silences, so it is behind Authentik forward auth: the middleware is
  # manifests/middleware.yaml, the provider the alertmanager.yaml key of
  # authentik/manifests/blueprints.yaml. See README.md, "Alertmanager UI".
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      # <namespace>-<name>@kubernetescrd. Nothing validates this string: get
      # it wrong and Traefik serves Alertmanager with no authentication.
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-authentik@kubernetescrd
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Alertmanager
      gethomepage.dev/description: Firing alerts and silences
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/icon: alertmanager.png
    hosts:
      - alertmanager.k8s.internal.smigorx.eu
    tls:
      - secretName: alertmanager-tls
        hosts:
          - alertmanager.k8s.internal.smigorx.eu

  # The Slack templates; nothing here uses Slack.
  monzoTemplate:
    enabled: false

  config:
    route:
      # Anything not matched below goes nowhere. The default rules carry a
      # good number of severity=info alerts (CPU throttling, for one) that are
      # worth seeing in Grafana and not worth a notification.
      receiver: blackhole
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

      routes:
        - receiver: discord
          matchers:
            - severity=~"warning|critical"

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity="warning"
        target_matchers:
          - severity="info"
        equal: [namespace, alertname]

    receivers:
      - name: blackhole
      - name: discord
        discord_configs:
          # _file, not webhook_url: the URL is the whole credential, and this
          # block ends up in a Secret the operator renders from Git.
          - webhook_url_file: /etc/alertmanager/discord/webhook-url
            send_resolved: true

# --- Exporters ---------------------------------------------------------------

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi

# --- Logs --------------------------------------------------------------------
#
# VictoriaLogs, created by the same operator as VMSingle. The chart points
# VLAgent at it and adds it to Grafana as a datasource on its own; see
# README.md, "Logs".

vlsingle:
  enabled: true
  spec:
    retentionPeriod: 30d
    # A ceiling under the claim, so a log storm deletes the oldest days
    # instead of filling the volume.
    retentionMaxDiskSpaceUsageBytes: 8GiB

    # On the SSD, bound to the static PV in manifests/ssd-volumes.yaml.
    storage:
      storageClassName: local-path-ssd
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

    # Pinned while local-path volumes live on one node; see README.md, "Storage".
    nodeSelector:
      kubernetes.io/hostname: fedora-server

    # The limit is for queries: a wide search over many days is what grows
    # it, not ingestion, which is a few hundred lines a minute here. ~160Mi
    # steady, but a query peaked at ~900Mi against the old 1Gi limit in the
    # 14 days to November 2026.
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        memory: 1536Mi

# One pod per node (a DaemonSet), so one here.
vlagent:
  enabled: true
  spec:
    # Every container's stdout/stderr, from /var/log/pods, tagged with
    # kubernetes.pod_namespace, kubernetes.pod_name and
    # kubernetes.container_name.
    k8sCollector:
      enabled: true

    # The host's own logs: k3s itself, systemd, sshd, dnf. They are in the
    # binary journal, which vlagent cannot read, but the host also runs
    # rsyslog, which writes them out as text. /var/log/messages is ~100MB a
    # week, almost all of it k3s.
    #
    # The operator happens to mount the host's /var/log at /var/log for
    # k8sCollector, but that is its implementation detail; this mount, under
    # /host, keeps working if that changes. The paths are also what the
    # `file` field of every host log line says.
    extraArgs:
      fileCollector.glob: /host/var/log/messages,/host/var/log/secure
    volumes:
      - name: host-var-log
        hostPath:
          path: /var/log
          type: Directory
    volumeMounts:
      - name: host-var-log
        mountPath: /host/var/log
        readOnly: true

    # ~48Mi steady, p99 ~90Mi (November 2026). One per node, so this is paid
    # twice.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

# With both VMSingle and VLSingle present, the chart puts a small VMAuth in
# front of VMAlert's datasource: /select/logsql/ goes to VictoriaLogs, the rest
# to VMSingle, so rules can be written against logs too. It is one more hop
# for every rule evaluation, which is why it gets explicit, small resources
# rather than the operator's defaults.
internal:
  vmauth:
    spec:
      port: "8427"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

# The chart's entry, renamed from "VictoriaLogs (DS)". Keep the uid: anything
# saved against this datasource refers to it by uid.
defaultDatasources:
  victorialogs:
    datasources:
      - name: VictoriaLogs
        access: proxy
        uid: VictoriaLogs
        type: victoriametrics-logs-datasource
        plugin: true

# --- Grafana -----------------------------------------------------------------

# The chart's ~40 stock dashboards (Windows, AIX and Darwin nodes, multicluster,
# the components k3s does not split out) are off. The dashboards used here are
# hand-written for this cluster and live in manifests/dashboards/; see
# README.md.
defaultDashboards:
  enabled: false

grafana:
  # Kept out of the chart's hands: left to itself it generates the admin
  # password with randAlphaNum, Argo CD re-renders it on every refresh, and the
  # Secret is permanently OutOfSync - the same trap forgejo/README.md describes.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # The datasource type for VictoriaLogs. Downloaded from grafana.com when the
  # pod starts, so a Grafana restart needs internet. The chart only adds the
  # VictoriaLogs datasource when its plugin is listed here.
  plugins:
    - victoriametrics-logs-datasource

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

  grafana.ini:
    server:
      root_url: https://grafana.k8s.internal.smigorx.eu

    auth:
      # Straight to Authentik. The local login form stays reachable at
      # /login?disableAutoLogin=true for the admin account above, which is the
      # way in when Authentik itself is what is broken.
      oauth_auto_login: true
      signout_redirect_url: https://auth.k8s.internal.smigorx.eu/application/o/grafana/end-session/

    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid profile email
      auth_url: https://auth.k8s.internal.smigorx.eu/application/o/authorize/
      token_url: https://auth.k8s.internal.smigorx.eu/application/o/token/
      api_url: https://auth.k8s.internal.smigorx.eu/application/o/userinfo/
      use_pkce: true
      # Authentik's profile scope carries a `groups` claim. The blueprint
      # already lets only authentik Admins through; strict mode is the second
      # lock - anyone who somehow arrives without that group maps to no role
      # and is refused rather than landing as a Viewer.
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin'
      role_attribute_strict: true
      allow_sign_up: true

    # Where the sidecar writes the `health.json` key of the homelab-dashboards
    # ConfigMap.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/health.json

  # Dashboards come from Git, but users, preferences and anything built by
  # hand in the UI live in Grafana's SQLite database. The claim is ours, on the
  # SSD (manifests/ssd-volumes.yaml), so the chart does not create one.
  persistence:
    enabled: true
    type: pvc
    existingClaim: vmks-grafana-ssd

  # Recreate, not the chart's RollingUpdate: two Grafanas writing one SQLite
  # file during a rollout is how it gets corrupted, and a ReadWriteOnce claim
  # does not stop that on one node.
  deploymentStrategy:
    type: Recreate

  # Pinned while local-path volumes live on one node; see README.md, "Storage".
  nodeSelector:
    kubernetes.io/hostname: fedora-server

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Grafana
      gethomepage.dev/description: Metrics and dashboards
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/icon: grafana.png
    hosts:
      - grafana.k8s.internal.smigorx.eu
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.k8s.internal.smigorx.eu

  # Was 160Mi / 512Mi and got OOM-killed: ~355Mi steady, p99 ~475Mi, peak
  # ~505Mi in the 14 days to November 2026. Dashboards with many panels
  # querying at once are what push it.
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi

  # Each of the two sidecars sits at ~75Mi (peak ~90Mi, November 2026).
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi

    # Everything the sidecar loads, which is every ConfigMap in this namespace
    # labelled grafana_dashboard: "1", goes in one folder. Provisioned
    # dashboards cannot be saved from the UI. Edit, then export the JSON over
    # the file in manifests/dashboards/.
    dashboards:
      provider:
        folder: Homelab
