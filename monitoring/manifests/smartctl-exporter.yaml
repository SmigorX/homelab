# SMART data from every disk in the cluster, for the disk alerts in rules.yaml
# and the SMART table on the Node dashboard. node-exporter only sees what the
# kernel sees (throughput, md state); a disk that is quietly growing bad
# sectors looks perfectly healthy to it until md kicks it out of the mirror.
#
# Plain manifests rather than the prometheus-smartctl-exporter chart: it is one
# DaemonSet and a scrape, and the chart would be a fourth source on the
# monitoring Application for that.
#
# The exporter finds disks itself (smartctl --scan, again every 10 minutes), so
# the new 1TB disk shows up without a change here. It polls each disk once a
# minute, skipping any that are spun down rather than waking them.
#
# Privileged and root: smartctl sends ATA and NVMe passthrough commands to the
# block devices, which needs CAP_SYS_RAWIO and CAP_SYS_ADMIN, and the image
# defaults to `nobody`. A privileged container also sees the host's /dev
# without a hostPath mount, and runs as spc_t, so SELinux does not need a
# label for it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartctl-exporter
    spec:
      # Every node, like node-exporter: a disk is worth watching wherever it is.
      tolerations:
        - operator: Exists
      containers:
        - name: smartctl-exporter
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0
          ports:
            - name: metrics
              containerPort: 9633
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          # Measured over its first day: ~20Mi and 1-5m CPU.
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
        # SMART self-tests. A drive only reads its whole surface when told to;
        # until this ran, no disk here had ever done a self-test, so a sector
        # that went bad in a region nothing reads would go unnoticed until md
        # needed it during a resync. smartd only starts the tests: the drive
        # runs them in firmware, yielding to normal I/O, and logs the result,
        # which the exporter reads (DiskSelfTestFailed in rules.yaml).
        #
        # Same image (it ships smartd), same privileges. The config is written
        # inline so that changing it changes the pod template and rolls the
        # DaemonSet; a ConfigMap would not. --debug is what sends smartd's
        # messages to stdout, so to VictoriaLogs, instead of a syslog socket
        # the container does not have; at this config it is three lines per
        # disk at startup and one per disk every 30 minutes.
        #
        # Schedule, in UTC (the container has no timezone; CET is +1): a short
        # test on the 1st of every month at 02:00, a minute or two per disk.
        # Short tests check the electronics, the heads and a sample of the
        # surface, not all of it.
        #
        # Long tests (the whole surface) are left out for now; sdc's takes ~8h
        # on an idle disk and it is rarely idle. To add them, staggered so the
        # two halves of md0 never test at once, e.g. on the 1st and 15th at
        # 22:00, 12 hours apart per disk in scan order (sda the 1st at 22:00,
        # ~2h; sdb the 2nd at 10:00; sdc the 2nd at 22:00):
        #   -s (S/../01/./02|L/../(01|15)/./22:012)
        # -n standby,q skips a disk that is spun down instead of waking it.
        # -H, -l selftest and -l error only log; nothing here sends mail.
        - name: smartd
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/smartd.conf <<'EOF'
              DEVICESCAN -H -l selftest -l error -n standby,q -s S/../01/./02
              EOF
              exec /usr/sbin/smartd --debug --quit=never --configfile=/etc/smartd.conf
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 64Mi
---
# VMPodScrape rather than a Service and a VMServiceScrape: nothing else talks
# to the exporter. The `node` label is what the Node dashboard and the alerts
# name the machine by; the pod's IP alone would not say which one it is.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: smartctl-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
