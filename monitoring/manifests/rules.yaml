# Alerting rules for this cluster, on top of the chart's defaults. VMAlert has
# selectAllByDefault, so any VMRule in any namespace is picked up.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: vault
      rules:
        # Nothing reports a sealed Vault directly: the pod stays 1/1 by design
        # (vault/README.md, "A sealed Vault still reports ready"), and Vault's
        # own metrics are not scraped. VSO is the first thing that notices,
        # because every VaultStaticSecret refresh fails. In November 2026
        # Vault sat sealed for five days this way and VSO's error counter
        # reached 163,000.
        #
        # VSO retries with a backoff capped at 60s (its --backoff-max-interval),
        # so a sealed Vault produces errors in every 10-minute window. A single
        # transient error does not last the 20 minutes `for` asks for.
        - alert: VaultSecretsOperatorFailing
          expr: sum(increase(vso_client_operations_errors_total[10m])) > 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: Vault Secrets Operator cannot reach Vault; it is probably sealed.
            description: >-
              VSO has failed {{ $value | humanize }} Vault calls in the last 10
              minutes. Secrets synced from Vault are not being refreshed. Check
              `kubectl --context default -n vault exec vault-0 -- vault status`
              and unseal it if Sealed is true; a vault-0 restart always comes
              back sealed.

    # From smartctl-exporter.yaml. The thresholds were set against what the
    # disks reported when it went in (November 2026), so none of these fire on
    # history:
    #
    #   sda  WD10EZEX (md0)     27k hours; 131 UDMA CRC errors. Its extended
    #                           error log (smartctl -l xerror) holds 1,004
    #                           entries, all from one unreadable sector at hour
    #                           11,607 that has since been rewritten. The
    #                           exporter reads the summary log, which is empty.
    #   sdb  Micron 5200 (OS)   47k hours, 19 average erase cycles; 14 CRC
    #                           errors, 107 command timeouts.
    #   sdc  IronWolf 4TB       3.3k hours, clean. Its Raw_Read_Error_Rate and
    #                           Seek_Error_Rate raw values are in the hundreds
    #                           of millions; on Seagates that is an encoded
    #                           operation count, not errors, so nothing here
    #                           reads them.
    #   nvme0 Kioxia (node 2)   11% of rated endurance used, no media errors.
    #
    # So counters that were already non-zero alert on growth over a day, not
    # on their value. A growth alert resolves a day after the counter stops
    # moving, which is the point: it says "this changed", and Discord keeps
    # the message.
    - name: disks
      rules:
        # The drive's own verdict: smartctl -H. Usually the last thing to
        # change, which is why the rules below look at the attributes too.
        - alert: DiskSmartFailing
          expr: smartctl_device_smart_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} reports SMART FAILED."
            description: >-
              The drive itself predicts failure. Replace it; if it is in md0,
              add the replacement before removing it.

        # Bit 4 of smartctl's exit status: a pre-failure attribute's
        # normalised value is at or below the vendor's threshold now.
        - alert: DiskSmartAttributeFailing
          expr: floor(smartctl_device_smartctl_exit_status / 16) % 2 == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} has a SMART attribute below its failure threshold."
            description: >-
              smartctl -A on the node lists it (WHEN_FAILED = FAILING_NOW).

        # Pending sectors are unreadable right now and are never benign, so
        # this one alerts on the value. The others alert when they grow.
        - alert: DiskBadSectors
          expr: >-
            smartctl_device_attribute{attribute_name="Current_Pending_Sector", attribute_value_type="raw"} > 0
            or
            delta(smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Reallocated_Event_Count|Reported_Uncorrect|Offline_Uncorrectable", attribute_value_type="raw"}[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }}: {{ $labels.attribute_name }} is {{ $value }} (pending, or growth over a day)."
            description: >-
              The disk is finding sectors it cannot read. A handful once can be
              a one-off; growth over several days means it is on its way out.
              For md0's disks, a check (echo check > /sys/block/md0/md/sync_action)
              rewrites unreadable sectors from the other half.

        - alert: DiskErrorLogGrowing
          expr: delta(smartctl_device_error_log_count[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} logged {{ $value }} new ATA errors in a day."
            description: >-
              smartctl -l xerror on the node shows them, with the power-on hour
              of each.

        # CRC errors are on the link, not the platters: a cable or port.
        - alert: DiskLinkErrors
          expr: delta(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count", attribute_value_type="raw"}[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }}: {{ $value }} new SATA CRC errors in a day."
            description: >-
              Reseat or replace the SATA cable, or move it to another port.
              The disk itself is fine; the errors are retried, but each retry
              stalls I/O.

        # critical_warning is a bitmask (spare low, temperature, reliability
        # degraded, read-only, backup failed); any bit is bad.
        - alert: NvmeCriticalWarning
          expr: >-
            smartctl_device_critical_warning > 0
            or
            smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} raised an NVMe critical warning."
            description: >-
              smartctl -a on the node decodes it under "Critical Warning".

        - alert: NvmeMediaErrors
          expr: delta(smartctl_device_media_errors[1d]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} had {{ $value }} new unrecovered media errors in a day."

        - alert: SsdWornOut
          expr: smartctl_device_percentage_used >= 90
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} has used {{ $value }}% of its rated write endurance."

        # Spinning disks age fastest above ~50°C; these sit at 34-38.
        # SSDs and NVMe throttle in the 70s.
        - alert: DiskTooHot
          expr: >-
            (smartctl_device_temperature{temperature_type="current"} > 50
              and on (node, device) smartctl_device_rotation_rate > 0)
            or
            (smartctl_device_temperature{temperature_type="current"} > 70
              unless on (node, device) smartctl_device_rotation_rate > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} is at {{ $value }}°C."

        # Bits 0-1 of the exit status: smartctl could not open or talk to the
        # disk, so every rule above is blind to it.
        - alert: DiskSmartUnreadable
          expr: smartctl_device_smartctl_exit_status % 4 > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "smartctl cannot read {{ $labels.node }}/{{ $labels.device }}."
            description: >-
              The disk may have dropped off the bus, or the exporter lost its
              privileges. kubectl --context default -n monitoring logs
              daemonset/smartctl-exporter.

    # Self-test results, from smartd's log rather than a metric: the exporter
    # runs smartctl with --log=error only, so it never reads the self-test log.
    # smartd (the second container in smartctl-exporter.yaml) does, because
    # of its -l selftest, and prints one of these two lines when a test fails.
    # vmalert sends `type: vlogs` groups to VictoriaLogs through
    # vmauth-vmks-internal.
    - name: disks-logs
      type: vlogs
      interval: 5m
      rules:
        # A failed self-test means the drive could not read part of its own
        # surface, which a disk that still says PASSED can do for a long time.
        # The log line appears once, so keep_firing_for holds the alert for a
        # day, like the growth alerts above.
        - alert: DiskSelfTestFailed
          expr: >-
            {kubernetes.pod_namespace="monitoring", kubernetes.container_name="smartd"}
            ("Self-Test Log error count increased" or "new Self-Test Log error")
            | extract "Device: /dev/<device> ["
            | copy kubernetes.pod_node_name as node
            | stats by (node, device) count() as errors
            | filter errors:>0
          keep_firing_for: 24h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }}/{{ $labels.device }} failed a SMART self-test."
            description: >-
              smartctl -l selftest on the node shows which test and the LBA of
              the first error. Plan the replacement; for md0's disks, run an md
              check first (echo check > /sys/block/md0/md/sync_action) so the
              other half rewrites what it can.
