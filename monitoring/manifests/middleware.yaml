# Forward auth for Alertmanager, which has no authentication of its own.
# Traefik asks Authentik about every request before it reaches the app.
#
# The provider behind it is the forward_single "alertmanager" one in
# authentik/manifests/blueprints.yaml, bound to authentik Admins; the outpost
# picks it by the request's Host. Its login round trip needs
# /outpost.goauthentik.io routed on the Alertmanager host, which
# authentik/manifests/outpost-ingress.yaml does. Same arrangement as
# arr-stack/manifests/middleware.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: monitoring
spec:
  forwardAuth:
    # The embedded outpost, served by authentik-server itself - there is no
    # separate outpost Deployment to run.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik

    # Traefik already sits at the edge, so the X-Forwarded-* it sends are the
    # real ones and Authentik needs to trust them to build the redirect back.
    trustForwardHeader: true

    # Passed through to the app. Alertmanager ignores them, but they are what
    # makes this middleware reusable for something that can consume a
    # trusted-header identity.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
