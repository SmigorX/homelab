# Synced from Vault by the Vault Secrets Operator.
# vaultAuthRef/vaultConnectionRef are intentionally omitted: VSO falls back to
# the cluster-wide "default" VaultAuth/VaultConnection in the operator's
# namespace. See vault/README.md.
#
# All three have to exist before the first sync - see README.md. A missing
# grafana-admin or grafana-oidc leaves Grafana in CreateContainerConfigError; a
# missing alertmanager-discord leaves Alertmanager in ContainerCreating.

# Grafana's local admin account, the way in when Authentik is down.
# Keys: admin-user, admin-password.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  type: kv-v2
  mount: secret
  path: monitoring/grafana-admin
  refreshAfter: 1h
  destination:
    name: grafana-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The OAuth2 client secret. Same value as grafana-client-secret in
# secret/authentik/oidc, which the Authentik blueprint reads.
# Key: client-secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  type: kv-v2
  mount: secret
  path: monitoring/grafana-oidc
  refreshAfter: 1h
  destination:
    name: grafana-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The Discord webhook URL Alertmanager posts to. The URL is the whole
# credential: anyone holding it can post to the channel.
# Key: webhook-url.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  type: kv-v2
  mount: secret
  path: monitoring/alertmanager-discord
  refreshAfter: 1h
  destination:
    name: alertmanager-discord
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
