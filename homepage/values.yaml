image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest

enableRbac: true

serviceAccount:
  create: true

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    ingressClassName: traefik

    labels:
      gethomepage.dev/enabled: "true"

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      gethomepage.dev/name: Homepage
      gethomepage.dev/description: Kubernetes dashboard
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/icon: homepage.png

    hosts:
      - host: homepage.k8s.internal.smigorx.eu
        paths:
          - path: /
            pathType: Prefix

    tls:
      - hosts:
          - homepage.k8s.internal.smigorx.eu
        secretName: homepage-tls

config:
  kubernetes:
    mode: cluster

  widgets:
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s

        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - search:
        provider: duckduckgo
        target: _blank

  bookmarks: []

  services: []

  settingsString: |
    title: Homepage
    headerStyle: boxed

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.k8s.internal.smigorx.eu

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs