apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joplin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads

  source:
    repoURL: git@github.com:SmigorX/homelab.git
    targetRevision: master
    path: joplin/manifests
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: joplin

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
