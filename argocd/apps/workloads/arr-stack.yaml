apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack
  namespace: argocd
spec:
  project: workloads

  source:
    repoURL: git@github.com:SmigorX/homelab.git
    targetRevision: master
    path: arr-stack/manifests
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: arr-stack

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
