apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: User-facing cluster workloads
  sourceRepos:
    - git@github.com:SmigorX/homelab.git
    - https://jameswynn.github.io/helm-charts
    # OCI registries: no oci:// prefix and no chart name - the chart goes in
    # the Application's `chart:` field.
    - ghcr.io/immich-app/immich-charts
    - code.forgejo.org/forgejo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
