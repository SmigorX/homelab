apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yamtrack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: git@github.com:SmigorX/homelab.git
    targetRevision: master
    path: yamtrack/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: yamtrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
