apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: workloads

  # Three sources, following argocd/apps/workloads/immich.yaml: the chart, the
  # repo as a values root for it, and the repo again for what the chart does
  # not provide (PostgreSQL and the Vault-synced secrets).
  sources:
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.1.7
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/forgejo/values.yaml
    - repoURL: git@github.com:SmigorX/homelab.git
      targetRevision: master
      ref: values
    - repoURL: git@github.com:SmigorX/homelab.git
      targetRevision: master
      path: forgejo/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
