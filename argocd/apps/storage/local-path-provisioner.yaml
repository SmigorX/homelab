apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-hdd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/rancher/local-path-provisioner/charts
    chart: local-path-provisioner
    targetRevision: 0.0.36

    helm:
      releaseName: local-path-hdd

      valuesObject:
        replicaCount: 1

        storageClass:
          create: false

        provisionerName: smigorx.eu/local-path-hdd

        storageClassConfigs:
          local-path-core:
            storageClass:
              create: true
              defaultClass: false
              defaultVolumeType: hostPath
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer

            nodePathMap:
              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths:
                  - /mnt/nas/core/k3s

          local-path-bulk:
            storageClass:
              create: true
              defaultClass: false
              defaultVolumeType: hostPath
              reclaimPolicy: Retain
              volumeBindingMode: WaitForFirstConsumer

            nodePathMap:
              - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
                paths:
                  - /mnt/nas/bulk/k3s

  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-hdd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true