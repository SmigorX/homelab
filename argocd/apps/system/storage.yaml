apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:SmigorX/homelab.git
    targetRevision: master
    path: storage
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: hdd-local-path-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
