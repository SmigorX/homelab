dex:
  enabled: false

notifications:
  enabled: false

# None of these components declared resources, which hid roughly 40m and 470Mi
# of steady usage from the scheduler. Requests only: one node, so a CPU limit
# would just throttle a burst that has nothing to compete with.
redis:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

applicationSet:
  replicas: 1

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

controller:
  replicas: 1

  # The busiest of the five: reconciling every Application on a timer.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 1

  # Spikes while rendering charts, which is why its memory request sits above
  # the 56Mi it idles at.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

server:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.k8s.internal.smigorx.eu
    path: /
    pathType: Prefix
    tls: true

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/name: Argo CD
      gethomepage.dev/description: GitOps continuous delivery
      gethomepage.dev/icon: argocd.png
      gethomepage.dev/href: https://argocd.k8s.internal.smigorx.eu
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/service.serversscheme: http

global:
  domain: argocd.k8s.internal.smigorx.eu

configs:
  cm:
    url: https://argocd.k8s.internal.smigorx.eu
    oidc.config: |
      name: Authentik
      issuer: https://auth.k8s.internal.smigorx.eu/application/o/argocd/
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email"]
      requestedIDTokenClaims: {"groups": {"essential": true}}
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, authentik Admins, role:admin
    scopes: "[groups, email]"
  params:
    server.insecure: true
