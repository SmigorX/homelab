apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: git@github.com:SmigorX/homelab.git
      targetRevision: master
      path: argocd
      directory:
        include: app-of-apps.yaml
    - repoURL: git@github.com:SmigorX/homelab.git
      targetRevision: master
      path: argocd/apps
      directory:
        recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Argo CD adds pre-delete-finalizer.argocd.argoproj.io (and .../cleanup) to
  # any Application whose chart has a PreDelete hook - vault-secrets-operator's
  # does - so its finalizers no longer match Git and this app reads OutOfSync.
  # Ignore exactly those two, and keep sync from stripping them, which would
  # only start a tug-of-war with the controller that re-adds them.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .metadata.finalizers[]? | select(startswith("pre-delete-finalizer.argocd.argoproj.io"))

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true