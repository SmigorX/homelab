apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-valkey
  namespace: paperless
spec:
  replicas: 1

  selector:
    matchLabels:
      app: paperless-valkey

  template:
    metadata:
      labels:
        app: paperless-valkey

    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          ports:
            - name: redis
              containerPort: 6379

          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-valkey
  namespace: paperless
spec:
  selector:
    app: paperless-valkey

  ports:
    - name: redis
      port: 6379
      targetPort: redis

  type: ClusterIP