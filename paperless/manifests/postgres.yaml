apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  instances: 1

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-postgres-app

  storage:
    storageClass: local-path-core
    size: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi