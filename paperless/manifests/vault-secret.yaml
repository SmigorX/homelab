# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
#
# paperless-postgres-ca is deliberately NOT here: it is owned by the
# CloudNativePG Cluster/paperless-postgres and regenerated by the operator.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-postgres
spec:
  type: kv-v2
  mount: secret
  path: paperless/postgres
  refreshAfter: 1h
  destination:
    name: paperless-postgres-app
    create: true
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-app
spec:
  type: kv-v2
  mount: secret
  path: paperless/app
  refreshAfter: 1h
  destination:
    name: paperless-secret
    create: true
    overwrite: true
---
# Holds both `config` (the JSON django-allauth blob) and `client-secret`.
# The value inside `config` must stay equal to
# authentik-oidc-secrets/paperless-client-secret in the authentik namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: paperless-oidc
spec:
  type: kv-v2
  mount: secret
  path: paperless/oidc
  refreshAfter: 1h
  destination:
    name: paperless-oidc
    create: true
    overwrite: true
