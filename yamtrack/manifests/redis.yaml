apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack-redis
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yamtrack-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yamtrack-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yamtrack-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: yamtrack-redis
  namespace: yamtrack
spec:
  selector:
    app.kubernetes.io/name: yamtrack-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
