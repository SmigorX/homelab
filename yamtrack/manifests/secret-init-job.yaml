apiVersion: batch/v1
kind: Job
metadata:
  name: yamtrack-secret-init
  namespace: yamtrack
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: yamtrack-secret-init
      restartPolicy: OnFailure
      containers:
        - name: create-secret-if-missing
          image: bitnami/kubectl:1.34.3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if kubectl get secret yamtrack-secrets >/dev/null 2>&1; then
                exit 0
              fi
              secret="$(head -c 64 /dev/urandom | base64 | tr -d '\n')"
              kubectl create secret generic yamtrack-secrets --from-literal=secret="$secret"
