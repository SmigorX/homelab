# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: yamtrack-app
spec:
  type: kv-v2
  mount: secret
  path: yamtrack/app
  refreshAfter: 1h
  destination:
    name: yamtrack-secrets
    create: true
    overwrite: true
---
# The client secret embedded in SOCIALACCOUNT_PROVIDERS must stay equal to
# authentik-oidc-secrets/yamtrack-client-secret in the authentik namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: yamtrack-oidc
spec:
  type: kv-v2
  mount: secret
  path: yamtrack/oidc
  refreshAfter: 1h
  destination:
    name: yamtrack-oidc-secrets
    create: true
    overwrite: true
