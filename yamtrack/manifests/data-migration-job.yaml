apiVersion: batch/v1
kind: Job
metadata:
  name: yamtrack-data-migration
  namespace: yamtrack
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy-sqlite-data
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if [ -f /target/.yamtrack-migration-complete ]; then
                exit 0
              fi
              test -f /source/db.sqlite3
              cp -a /source/. /target/
              touch /target/.yamtrack-migration-complete
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          hostPath:
            path: /home/smigorx/docker/yamtrack/db
            type: Directory
        - name: target
          persistentVolumeClaim:
            claimName: yamtrack-data
