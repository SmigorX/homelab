apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack
  namespace: yamtrack
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: yamtrack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yamtrack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yamtrack
    spec:
      serviceAccountName: yamtrack-secret-init
      initContainers:
        - name: initialize-secret
          image: bitnami/kubectl:1.34.3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              umask 077
              if kubectl get secret yamtrack-secrets >/dev/null 2>&1; then
                kubectl get secret yamtrack-secrets -o jsonpath='{.data.secret}' | base64 -d > /run/yamtrack-secret/secret
                exit 0
              fi
              secret="$(head -c 64 /dev/urandom | base64 | tr -d '\n')"
              kubectl create secret generic yamtrack-secrets --from-literal=secret="$secret"
              printf '%s' "$secret" > /run/yamtrack-secret/secret
          volumeMounts:
            - name: runtime-secret
              mountPath: /run/yamtrack-secret
      containers:
        - name: yamtrack
          image: ghcr.io/fuzzygrim/yamtrack:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: SECRET_FILE
              value: /run/yamtrack-secret/secret
            - name: REDIS_URL
              value: redis://yamtrack-redis:6379
            - name: URLS
              value: https://yamtrack.k8s.internal.smigorx.eu
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /yamtrack/db
            - name: runtime-secret
              mountPath: /run/yamtrack-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yamtrack-data
        - name: runtime-secret
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: yamtrack
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack
spec:
  selector:
    app.kubernetes.io/name: yamtrack
  ports:
    - name: http
      port: 8000
      targetPort: http
