apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yamtrack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yamtrack
    spec:
      containers:
        - name: yamtrack
          image: ghcr.io/fuzzygrim/yamtrack:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Warsaw

            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: yamtrack-secrets
                  key: secret

            - name: REDIS_URL
              value: redis://yamtrack-redis:6379

            - name: URLS
              value: "https://yamtrack.k8s.internal.smigorx.eu"

            - name: SOCIAL_PROVIDERS
              value: "allauth.socialaccount.providers.openid_connect"

            - name: SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: yamtrack-oidc-secrets
                  key: SOCIALACCOUNT_PROVIDERS

            - name: ACCOUNT_DEFAULT_HTTP_PROTOCOL
              value: https

          ports:
            - name: http
              containerPort: 8000

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /yamtrack/db

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yamtrack-data
---
apiVersion: v1
kind: Service
metadata:
  name: yamtrack
  namespace: yamtrack
  labels:
    app.kubernetes.io/name: yamtrack
spec:
  selector:
    app.kubernetes.io/name: yamtrack
  ports:
    - name: http
      port: 8000
      targetPort: http