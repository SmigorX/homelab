# Synced from Vault by the Vault Secrets Operator.
# vaultAuthRef/vaultConnectionRef are intentionally omitted: VSO falls back to
# the cluster-wide "default" VaultAuth/VaultConnection in the operator's
# namespace. See vault/README.md.
#
# forgejo-postgres-ca is deliberately NOT here: it is owned by the
# CloudNativePG Cluster/forgejo-postgres and regenerated by the operator.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-postgres
spec:
  type: kv-v2
  mount: secret
  path: forgejo/postgres
  refreshAfter: 1h
  destination:
    name: forgejo-postgres-app
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The local administrator. Keys `username` and `password`; the chart reads both
# by those names. Deliberately not generated by the chart - see the comment on
# gitea.admin.existingSecret in ../values.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-admin
spec:
  type: kv-v2
  mount: secret
  path: forgejo/admin
  refreshAfter: 1h
  destination:
    name: forgejo-admin
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The Authentik client. `key` is the client id (forgejo) and `secret` the
# client secret, which must stay equal to
# authentik-oidc-secrets/forgejo-client-secret in the authentik namespace. Both
# key names are dictated by the chart, not chosen here.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-oidc
spec:
  type: kv-v2
  mount: secret
  path: forgejo/oidc
  refreshAfter: 1h
  destination:
    name: forgejo-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
