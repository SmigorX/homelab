# Trimmed from the upstream chart defaults: https://github.com/hashicorp/vault-helm/blob/main/values.yaml
# Anything not listed here just falls back to that file's default.

global:
  enabled: true

  # TLS for end-to-end encrypted transport
  tlsDisable: true

injector:
  enabled: false

server:
  image:
    repository: "hashicorp/vault"
    tag: "2.0.4"
    pullPolicy: IfNotPresent

  # OnDelete means config/image changes don't auto-roll the StatefulSet pods.
  # That's intentional for Vault: a replaced pod comes up sealed and needs a
  # manual unseal, so rollouts should be deliberate either way.
  updateStrategyType: "OnDelete"

  # Idles at ~10m and 57Mi. No CPU limit, in line with the rest of this cluster:
  # a single node has no other tenant to protect, so a limit only throttles.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  # The chart's default readiness probe execs `vault status`, which exits
  # non-zero on a sealed Vault. That is defensible in an HA cluster, where a
  # sealed node should be taken out of rotation so the others serve. Here there
  # is exactly one node, and taking it out of rotation only makes the web UI
  # unreachable - which is the one thing needed to unseal it. Vault reseals on
  # every pod restart, so that happens often enough to matter.
  #
  # Switching to the http path turns the probe into a question about the
  # process rather than the seal: sealedcode and uninitcode remap those two
  # states onto 204, which a probe counts as success. A Vault that cannot
  # answer at all still fails, which is what the probe is for.
  #
  # The cost is a lost signal: `kubectl get pods` now reports 1/1 for a sealed
  # Vault. Ask Vault instead - `kubectl -n vault exec vault-0 -- vault status`.
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"

  # Ingress allows ingress services to be created to allow external access
  # from Kubernetes to access Vault pods.
  ingress:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
      gethomepage.dev/name: Vault
      gethomepage.dev/description: Secrets management
      gethomepage.dev/group: Platform
      gethomepage.dev/icon: vault.png
      gethomepage.dev/href: https://vault.k8s.internal.smigorx.eu
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/service.serversscheme: http
    ingressClassName: traefik
    hosts:
      - host: vault.k8s.internal.smigorx.eu
        paths: []
    tls:
      - secretName: vault-tls
        hosts:
          - vault.k8s.internal.smigorx.eu

  # authDelegator enables a cluster role binding to be attached to the service
  # account. This cluster role binding can be used to setup Kubernetes auth
  # method. See https://developer.hashicorp.com/vault/docs/auth/kubernetes
  authDelegator:
    enabled: true

  service:
    enabled: true
    port: 8200
    targetPort: 8200

  # This configures the Vault Statefulset to create a PVC for data
  # storage when using the file or raft backend storage engines.
  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: "/vault/data"
    storageClass: local-path-core
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  # Run Vault in "standalone" mode: single replica, file storage backend via
  # the dataStorage PVC above. Not highly available — fine for one node.
  standalone:
    enabled: "-"
    config: |-
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }

  serviceAccount:
    create: true

# Vault UI, managed by config up there
ui:
  enabled: false
