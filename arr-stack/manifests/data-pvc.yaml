# Binds to the static PersistentVolume in data-pv.yaml. storageClassName is the
# empty string and volumeName is explicit, so this claim can only ever bind to
# that one volume and never triggers dynamic provisioning.
#
# ReadWriteOnce while three pods mount it at once (qBittorrent, Sonarr, Radarr)
# is not a contradiction: RWO restricts a volume to one *node*, not one pod, and
# all three are pinned to fedora-server, the node that has /mnt/nas. Jellyfin,
# on fedora-server-2, reads media/ over NFS instead (jellyfin/pv.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-stack-data
  namespace: arr-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: arr-stack-data
  resources:
    requests:
      storage: 4Ti
