# Synced from Vault by the Vault Secrets Operator.
# vaultAuthRef/vaultConnectionRef are intentionally omitted: VSO falls back to
# the cluster-wide "default" VaultAuth/VaultConnection in the operator's
# namespace. See vault/README.md.
#
# One key, wg0.conf, holding the whole WireGuard configuration rather than the
# private key alone. wg-quick reads a file, not environment variables, so
# splitting the config into fields would only mean reassembling it in an
# initContainer - and the peer public key and endpoint are no more publishable
# than the private key is.
#
# The only other secret is Radarr's OIDC client secret, below. qBittorrent's
# WebUI password is set through its own interface, and the *arr API keys
# generate themselves into each app's /config on first boot.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: qbittorrent-wireguard
  namespace: arr-stack
spec:
  type: kv-v2
  mount: secret
  path: arr-stack/qbittorrent-wireguard
  refreshAfter: 1h
  destination:
    name: qbittorrent-wireguard
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# Radarr's half of its OIDC client secret. Must equal radarr-client-secret at
# secret/authentik/oidc, which is the copy Authentik's blueprint reads.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: radarr-oidc
  namespace: arr-stack
spec:
  type: kv-v2
  mount: secret
  path: arr-stack/radarr-oidc
  refreshAfter: 1h
  destination:
    name: radarr-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
