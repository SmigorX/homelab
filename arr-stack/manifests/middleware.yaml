# Forward auth for the four apps in this namespace that cannot authenticate
# themselves to anyone's satisfaction: qBittorrent, Prowlarr, Sonarr and Radarr.
# Copied from uptime-kuma/manifests/middleware.yaml, which explains why the
# provider behind it runs in forward_domain mode.
#
# One Middleware for four apps, unlike Uptime Kuma's one-per-namespace, because
# a Middleware is namespaced and all four live here. Traefik still resolves it
# per router as arr-stack-authentik@kubernetescrd.
#
# Jellyfin deliberately does not use this: it has its own accounts and is meant
# to be opened by people who have no Authentik login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: arr-stack
spec:
  forwardAuth:
    # The embedded outpost, served by authentik-server itself - there is no
    # separate outpost Deployment to run.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik

    # Traefik already sits at the edge, so the X-Forwarded-* it sends are the
    # real ones and Authentik needs to trust them to build the redirect back.
    trustForwardHeader: true

    # Passed through to the app. The *arr suite ignores them, but they are what
    # makes this middleware reusable for something that can consume a
    # trusted-header identity.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
