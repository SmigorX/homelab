# Forward auth for the three apps in this namespace that cannot authenticate
# themselves to anyone's satisfaction: qBittorrent, Prowlarr and Sonarr.
# Each has its own forward_single provider in Authentik, bound to authentik
# Admins; one Middleware serves all three because the outpost picks the
# provider by the request's Host. See arr-stack/README.md, "Authentik".
#
# Radarr does not use this: it has had its own OIDC login since v7.
#
# Jellyfin deliberately does not use this: it has its own accounts and is meant
# to be opened by people who have no Authentik login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: arr-stack
spec:
  forwardAuth:
    # The embedded outpost, served by authentik-server itself - there is no
    # separate outpost Deployment to run.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik

    # Traefik already sits at the edge, so the X-Forwarded-* it sends are the
    # real ones and Authentik needs to trust them to build the redirect back.
    trustForwardHeader: true

    # Passed through to the app. The *arr suite ignores them, but they are what
    # makes this middleware reusable for something that can consume a
    # trusted-header identity.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
