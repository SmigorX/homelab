apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: arr-stack
  annotations:
    gethomepage.dev/enabled: "true"
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/description: Torrent client, VPN bound
    gethomepage.dev/group: Media Management
    gethomepage.dev/icon: qbittorrent.png
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

    # <namespace>-<middleware name>@kubernetescrd is Traefik's naming for a
    # Middleware CRD. Getting this wrong fails open - the route simply serves
    # the app with no authentication - so it is worth checking after any
    # rename.
    traefik.ingress.kubernetes.io/router.middlewares: arr-stack-authentik@kubernetescrd
spec:
  ingressClassName: traefik

  rules:
    - host: qbittorrent.k8s.internal.smigorx.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  name: webui
  tls:
    - hosts:
        - qbittorrent.k8s.internal.smigorx.eu
      secretName: qbittorrent-tls
