# Jellyfin's configuration, user accounts, watch state and its metadata cache
# - artwork, subtitles and the chapter images it extracts. The accounts and
# watch history are the part that cannot be regenerated; the cache is merely
# slow and bandwidth-hungry to rebuild, which is why the whole directory comes
# across rather than just the database.
#
# Rsynced from ./config/jellyfin next to the old compose file; see
# arr-stack/README.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
spec:
  # Larger than the *arr volumes because the metadata cache grows with the
  # library, not with the number of settings.
  capacity:
    storage: 50Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  volumeMode: Filesystem

  storageClassName: ""

  claimRef:
    namespace: arr-stack
    name: jellyfin-config

  hostPath:
    path: /mnt/nas/bulk/arr/config/jellyfin
    type: Directory
