apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr-stack
spec:
  replicas: 1

  # ReadWriteOnce config volume over a SQLite database that tolerates exactly
  # one writer.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: sonarr

  template:
    metadata:
      labels:
        app: sonarr

    spec:
      enableServiceLinks: false

      # Pinned while the arr stack's hostPath volumes live on one node; see
      # README.md, "Storage".
      nodeSelector:
        kubernetes.io/hostname: fedora-server

      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325

          env:
            - name: PUID
              value: "1000"

            - name: PGID
              value: "1000"

            - name: TZ
              value: Europe/Warsaw

          ports:
            - name: http
              containerPort: 8989

          volumeMounts:
            - name: config
              mountPath: /config

            # The whole tree at /data, not media/ alone. Sonarr has to see
            # qBittorrent's completed downloads and the library through one
            # mount to import by hardlink; given two mounts it falls back to
            # copying, which doubles the space and takes minutes per episode.
            # The database stores paths under /data, so the mount point must
            # not move.
            - name: data
              mountPath: /data

          # Idles at ~4m CPU.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config

        - name: data
          persistentVolumeClaim:
            claimName: arr-stack-data
