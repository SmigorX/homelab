# A headless browser Prowlarr drives to get past Cloudflare interstitials on
# indexers that use them.
#
# Stateless, so no volume: every session is thrown away when the pod restarts.
#
# Deliberately not behind the VPN. It answers Prowlarr, which is not behind it
# either, and a Cloudflare challenge solved from a datacentre exit address that
# thousands of people share is markedly more likely to be challenged again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: arr-stack
spec:
  replicas: 1

  selector:
    matchLabels:
      app: flaresolverr

  template:
    metadata:
      labels:
        app: flaresolverr

    spec:
      enableServiceLinks: false

      # No nodeSelector, unlike the rest of the arr stack: with no volume,
      # nothing ties it to the node holding /mnt/nas, and Prowlarr reaches it
      # through its Service from either node.

      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2

          env:
            - name: LOG_LEVEL
              value: info

            - name: TZ
              value: Europe/Warsaw

          ports:
            - name: http
              containerPort: 8191

          # Chromium only runs while a challenge is being solved; between
          # requests this idles at ~145Mi. It is spiky: p99 ~840Mi and a peak
          # of 2041Mi against the old 2Gi limit in the 14 days to November
          # 2026. The request covers idle; the limit is for a page that
          # decides to be expensive, and costs nothing until it is used.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 3Gi

          # A wedged browser answers the port but never solves a challenge, and
          # Prowlarr's only symptom is indexers quietly failing.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
