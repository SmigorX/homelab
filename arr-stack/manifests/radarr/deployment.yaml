apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: arr-stack
spec:
  replicas: 1

  # ReadWriteOnce config volume over a SQLite database that tolerates exactly
  # one writer.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: radarr

  template:
    metadata:
      labels:
        app: radarr

    spec:
      enableServiceLinks: false

      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328

          env:
            - name: PUID
              value: "1000"

            - name: PGID
              value: "1000"

            - name: TZ
              value: Europe/Warsaw

            # Radarr's own OIDC login (new in v7), against the radarr.yaml
            # blueprint in authentik/manifests/blueprints.yaml. Every setting is
            # an environment variable, which takes precedence over config.xml,
            # so the UI cannot drift it. See arr-stack/README.md, "Radarr: OIDC".
            - name: Radarr__Auth__Method
              value: Oidc
            - name: Radarr__Auth__Required
              value: Enabled
            - name: Radarr__Auth__OidcAuthority
              value: https://auth.k8s.internal.smigorx.eu/application/o/radarr/
            - name: Radarr__Auth__OidcClientId
              value: radarr
            - name: Radarr__Auth__OidcClientSecret
              valueFrom:
                secretKeyRef:
                  name: radarr-oidc
                  key: client-secret

            # Radarr admits exactly one identity: a verified email or a `sub`.
            # This is akadmin's `sub` (Authentik's hashed_user_id), the one
            # member of authentik Admins - which the Authentik binding also
            # requires. Not a secret; it identifies, it does not authenticate.
            - name: Radarr__Auth__OidcUserIdentifier
              value: 544c5460c58b7d88c55ab44fbcad9667c58873fd803857f13c7fd586eb23b956

            # Traefik's pod IPs. Without this Radarr ignores X-Forwarded-Proto,
            # builds an http:// redirect URI, and Authentik's strict match
            # rejects the login.
            - name: Radarr__Server__TrustedNetworks
              value: 10.42.0.0/16

          ports:
            - name: http
              containerPort: 7878

          volumeMounts:
            - name: config
              mountPath: /config

            # The whole tree at /data for the same reason as Sonarr: downloads
            # and library under one mount, so imports hardlink instead of copy.
            - name: data
              mountPath: /data

          # Idles at ~2m CPU.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config

        - name: data
          persistentVolumeClaim:
            claimName: arr-stack-data
