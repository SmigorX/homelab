# Synced from Vault by the Vault Secrets Operator.
# vaultAuthRef/vaultConnectionRef are intentionally omitted: VSO falls back to
# the cluster-wide "default" VaultAuth/VaultConnection in the operator's
# namespace. See vault/README.md.
#
# miniflux-postgres-ca is deliberately NOT here: it is owned by the
# CloudNativePG Cluster/miniflux-postgres and regenerated by the operator.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: miniflux-postgres
spec:
  type: kv-v2
  mount: secret
  path: miniflux/postgres
  refreshAfter: 1h
  destination:
    name: miniflux-postgres-app
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# ADMIN_USERNAME and ADMIN_PASSWORD for the local account Miniflux creates on
# first boot.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: miniflux-app
spec:
  type: kv-v2
  mount: secret
  path: miniflux/app
  refreshAfter: 1h
  destination:
    name: miniflux-secret
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# Holds `client-secret`, which must stay equal to
# authentik-oidc-secrets/miniflux-client-secret in the authentik namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: miniflux-oidc
spec:
  type: kv-v2
  mount: secret
  path: miniflux/oidc
  refreshAfter: 1h
  destination:
    name: miniflux-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
