apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  namespace: joplin
  labels:
    app.kubernetes.io/name: joplin
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: joplin
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joplin
        app.kubernetes.io/component: server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h joplin-postgres -p 5432; do sleep 2; done
      containers:
        - name: joplin
          image: joplin/server:3.7.1
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PORT
              value: "22300"
            - name: APP_BASE_URL
              value: https://joplin.internal.smigorx.eu
            - name: API_BASE_URL
              value: https://joplin.internal.smigorx.eu
            - name: SAML_ENABLED
              value: "true"
            - name: SAML_IDP_CONFIG_FILE
              value: /saml/joplin-idp.xml
            - name: SAML_SP_CONFIG_FILE
              value: /saml/joplin-sp.xml
            - name: DELETE_EXPIRED_SESSIONS_SCHEDULE
              value: ""
            - name: LOCAL_AUTH_ENABLED
              value: "false"
            - name: DB_CLIENT
              value: pg
            - name: POSTGRES_HOST
              value: joplin-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: joplin
            - name: POSTGRES_USER
              value: joplin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joplin-secrets
                  key: postgres-password
          volumeMounts:
            - name: saml-config
              mountPath: /saml
              readOnly: true
          ports:
            - name: http
              containerPort: 22300
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: saml-config
          configMap:
            name: joplin-saml-config
