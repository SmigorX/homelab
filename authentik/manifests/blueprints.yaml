apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: Argo CD OIDC application
      labels:
        blueprints.goauthentik.io/description: Argo CD single sign-on configuration
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: argocd
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            # Argo CD's native OIDC callback. dex.enabled is false, so this is
            # NOT the /api/dex/callback that the goauthentik integration guide
            # documents. It sends this even with enablePKCEAuthentication -
            # the code_challenge rides along on the same request.
            - matching_mode: strict
              url: https://argocd.k8s.internal.smigorx.eu/auth/callback
            - matching_mode: strict
              url: https://argocd.k8s.internal.smigorx.eu/pkce/verify
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          group: Infrastructure
          meta_launch_url: https://argocd.k8s.internal.smigorx.eu
          provider: !KeyOf argocd-provider
  joplin.yaml: |
    version: 1
    metadata:
      name: Joplin SAML application
      labels:
        blueprints.goauthentik.io/description: Joplin single sign-on configuration
    entries:
      - model: authentik_providers_saml.samlprovider
        id: joplin-provider
        identifiers:
          name: joplin
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          acs_url: https://joplin.internal.smigorx.eu/api/saml
          audience: joplin
          sp_binding: post
          signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Authentik rejects a signing keypair with neither flag set, which
          # is why this blueprint never applied. Both match the provider that
          # was created by hand and is actually serving Joplin today.
          sign_assertion: true
          sign_response: true
      - model: authentik_core.application
        identifiers:
          slug: joplin
        attrs:
          name: Joplin
          group: Applications
          meta_launch_url: https://joplin.internal.smigorx.eu
          provider: !KeyOf joplin-provider
  yamtrack.yaml: |
    version: 1
    metadata:
      name: Yamtrack OIDC application
      labels:
        blueprints.goauthentik.io/description: Yamtrack single sign-on configuration
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: yamtrack-provider
        identifiers:
          name: yamtrack
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: yamtrack
          client_secret: !Env YAMTRACK_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://yamtrack.k8s.internal.smigorx.eu/accounts/oidc/authentik/login/callback/
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: yamtrack
        attrs:
          name: Yamtrack
          group: Media Management
          meta_launch_url: https://yamtrack.k8s.internal.smigorx.eu
          provider: !KeyOf yamtrack-provider
  paperless.yaml: |
    version: 1
    metadata:
      name: Paperless OIDC application
      labels:
        blueprints.goauthentik.io/description: Paperless single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: paperless-provider
        identifiers:
          name: paperless
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: paperless
          client_secret: !Env PAPERLESS_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://paperless.k8s.internal.smigorx.eu/accounts/oidc/authentik/login/callback/

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: paperless
        attrs:
          name: Paperless
          group: Media Management
          meta_launch_url: https://paperless.k8s.internal.smigorx.eu
          provider: !KeyOf paperless-provider
  vault.yaml: |
    version: 1
    metadata:
      name: Vault OIDC application
      labels:
        blueprints.goauthentik.io/description: Vault single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: vault-provider
        identifiers:
          name: vault
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: vault
          client_secret: !Env VAULT_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://vault.k8s.internal.smigorx.eu/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://vault.k8s.internal.smigorx.eu/oidc/callback
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: vault
        attrs:
          name: Vault
          group: Platform
          meta_launch_url: https://vault.k8s.internal.smigorx.eu
          provider: !KeyOf vault-provider
  nextcloud.yaml: |
    version: 1
    metadata:
      name: Nextcloud OIDC application
      labels:
        blueprints.goauthentik.io/description: Nextcloud single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: nextcloud-provider
        identifiers:
          name: nextcloud
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: nextcloud
          client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET

          # Defaults to an empty list on the model, which rejects every
          # authorize request with "Invalid grant_type for provider". The
          # older providers here only have it because a migration backfilled
          # them; anything created fresh must set it explicitly.
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://nextcloud.k8s.internal.smigorx.eu/apps/user_oidc/code

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Nextcloud grants admin purely by membership of the group whose id is
      # literally "admin", and user_oidc uses the raw claim value as the group
      # id. Authentik's own "authentik Admins" group would therefore create a
      # separate, powerless Nextcloud group - hence a group named exactly
      # "admin" here.
      - model: authentik_core.group
        identifiers:
          name: admin
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_core.application
        identifiers:
          slug: nextcloud
        attrs:
          name: Nextcloud
          group: Applications
          meta_launch_url: https://nextcloud.k8s.internal.smigorx.eu
          provider: !KeyOf nextcloud-provider

  # Uptime Kuma has no OIDC of its own, so unlike every other entry in this
  # ConfigMap this is a proxy provider rather than an OAuth2 one: Traefik asks
  # Authentik about each request before it reaches the app.
  #
  # forward_domain, not forward_single. Single-application mode requires
  # /outpost.goauthentik.io/* to be reachable on the application's own host,
  # which under k3s would need an ExternalName Service that Traefik refuses to
  # route by default. Domain level keeps the round trip on the Authentik host
  # and sets one cookie for the whole k8s.internal.smigorx.eu zone, so this
  # provider is reusable by any other app that cannot authenticate itself.
  #
  # No client secret here: Authentik generates one for proxy providers, so
  # unlike the OAuth2 entries above there is nothing to keep in step with
  # authentik/values.yaml or Vault.
  uptime-kuma.yaml: |
    version: 1
    metadata:
      name: Uptime Kuma forward auth application
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: uptime-kuma-provider
        identifiers:
          name: uptime-kuma
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          external_host: https://auth.k8s.internal.smigorx.eu
          cookie_domain: k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: uptime-kuma-app
        identifiers:
          slug: uptime-kuma
        attrs:
          name: Uptime Kuma
          group: Infrastructure
          meta_launch_url: https://uptime.k8s.internal.smigorx.eu
          provider: !KeyOf uptime-kuma-provider

          # Already the model default, but the bindings below are only an
          # allow-list under "any". Flipped to "all" - which the UI offers as
          # a dropdown on the application - they would instead demand
          # membership of both groups at once, and nobody is in both.
          policy_engine_mode: any

      # Created by hand in the UI, and declared here so that the membership
      # deciding who reaches Uptime Kuma is visible in Git. The user itself
      # stays hand-made on purpose: declaring it would put a password in the
      # repo, so this !Find fails the blueprint if the account is ever
      # renamed or deleted.
      #
      # Like the outpost provider list below, this replaces the membership
      # rather than adding to it - a guest added through the web interface is
      # removed on the next reconcile, so new ones belong in this list.
      - model: authentik_core.group
        identifiers:
          name: guests
        attrs:
          users:
            - !Find [authentik_core.user, [username, Gruzin]]

      # Until these existed the application had no bindings at all, and an
      # application without bindings is open to every authenticated user:
      # forward auth proved only that someone had logged in to Authentik,
      # never that they were entitled to this app in particular. Admins are
      # bound explicitly because that default is now gone - a superuser gets
      # no implicit pass.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf uptime-kuma-app
          group: !Find [authentik_core.group, [name, guests]]
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf uptime-kuma-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 1
        attrs:
          enabled: true

      # The embedded outpost only proxies providers explicitly assigned to it.
      # This list replaces whatever is there, which is safe only because this
      # is currently the single proxy provider in the cluster - a second one
      # must be added to this same list, not to a list of its own.
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          providers:
            - !KeyOf uptime-kuma-provider
  miniflux.yaml: |
    version: 1
    metadata:
      name: Miniflux OIDC application
      labels:
        blueprints.goauthentik.io/description: Miniflux single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: miniflux-provider
        identifiers:
          name: miniflux
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: miniflux
          client_secret: !Env MINIFLUX_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # Miniflux builds this path itself from the provider name, so it is
          # /oauth2/oidc/callback whatever the application is called here.
          redirect_uris:
            - matching_mode: strict
              url: https://miniflux.k8s.internal.smigorx.eu/oauth2/oidc/callback

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # The slug is load-bearing beyond routing: Authentik serves this
      # provider's OIDC discovery document at /application/o/<slug>/, which is
      # exactly what OAUTH2_OIDC_DISCOVERY_ENDPOINT points at. Renaming it
      # breaks discovery, not just the launch link.
      - model: authentik_core.application
        identifiers:
          slug: miniflux
        attrs:
          name: Miniflux
          group: Applications
          meta_launch_url: https://miniflux.k8s.internal.smigorx.eu
          provider: !KeyOf miniflux-provider
