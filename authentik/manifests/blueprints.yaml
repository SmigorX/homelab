apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: Argo CD OIDC application
      labels:
        blueprints.goauthentik.io/description: Argo CD single sign-on configuration
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: argocd
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            # Argo CD's native OIDC callback. dex.enabled is false, so this is
            # NOT the /api/dex/callback that the goauthentik integration guide
            # documents. It sends this even with enablePKCEAuthentication -
            # the code_challenge rides along on the same request.
            - matching_mode: strict
              url: https://argocd.k8s.internal.smigorx.eu/auth/callback
            - matching_mode: strict
              url: https://argocd.k8s.internal.smigorx.eu/pkce/verify
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          group: Infrastructure
          meta_launch_url: https://argocd.k8s.internal.smigorx.eu
          provider: !KeyOf argocd-provider
  joplin.yaml: |
    version: 1
    metadata:
      name: Joplin SAML application
      labels:
        blueprints.goauthentik.io/description: Joplin single sign-on configuration
    entries:
      - model: authentik_providers_saml.samlprovider
        id: joplin-provider
        identifiers:
          name: joplin
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          acs_url: https://joplin.internal.smigorx.eu/api/saml
          audience: joplin
          sp_binding: post
          signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Authentik rejects a signing keypair with neither flag set.
          sign_assertion: true
          sign_response: true
      - model: authentik_core.application
        identifiers:
          slug: joplin
        attrs:
          name: Joplin
          group: Applications
          meta_launch_url: https://joplin.internal.smigorx.eu
          provider: !KeyOf joplin-provider
  yamtrack.yaml: |
    version: 1
    metadata:
      name: Yamtrack OIDC application
      labels:
        blueprints.goauthentik.io/description: Yamtrack single sign-on configuration
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: yamtrack-provider
        identifiers:
          name: yamtrack
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: yamtrack
          client_secret: !Env YAMTRACK_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://yamtrack.k8s.internal.smigorx.eu/accounts/oidc/authentik/login/callback/
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: yamtrack
        attrs:
          name: Yamtrack
          group: Media Management
          meta_launch_url: https://yamtrack.k8s.internal.smigorx.eu
          provider: !KeyOf yamtrack-provider
  paperless.yaml: |
    version: 1
    metadata:
      name: Paperless OIDC application
      labels:
        blueprints.goauthentik.io/description: Paperless single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: paperless-provider
        identifiers:
          name: paperless
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: paperless
          client_secret: !Env PAPERLESS_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://paperless.k8s.internal.smigorx.eu/accounts/oidc/authentik/login/callback/

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: paperless
        attrs:
          name: Paperless
          group: Media Management
          meta_launch_url: https://paperless.k8s.internal.smigorx.eu
          provider: !KeyOf paperless-provider
  vault.yaml: |
    version: 1
    metadata:
      name: Vault OIDC application
      labels:
        blueprints.goauthentik.io/description: Vault single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: vault-provider
        identifiers:
          name: vault
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: vault
          client_secret: !Env VAULT_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://vault.k8s.internal.smigorx.eu/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://vault.k8s.internal.smigorx.eu/oidc/callback
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: vault
        attrs:
          name: Vault
          group: Platform
          meta_launch_url: https://vault.k8s.internal.smigorx.eu
          provider: !KeyOf vault-provider
  nextcloud.yaml: |
    version: 1
    metadata:
      name: Nextcloud OIDC application
      labels:
        blueprints.goauthentik.io/description: Nextcloud single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: nextcloud-provider
        identifiers:
          name: nextcloud
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: nextcloud
          client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET

          # Defaults to an empty list on the model, which rejects every
          # authorize request with "Invalid grant_type for provider". The
          # older providers here only have it because a migration backfilled
          # them; anything created fresh must set it explicitly.
          grant_types:
            - authorization_code
            - refresh_token

          redirect_uris:
            - matching_mode: strict
              url: https://nextcloud.k8s.internal.smigorx.eu/apps/user_oidc/code

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Nextcloud grants admin purely by membership of the group whose id is
      # literally "admin", and user_oidc uses the raw claim value as the group
      # id. Authentik's own "authentik Admins" group would therefore create a
      # separate, powerless Nextcloud group - hence a group named exactly
      # "admin" here.
      - model: authentik_core.group
        identifiers:
          name: admin
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      - model: authentik_core.application
        identifiers:
          slug: nextcloud
        attrs:
          name: Nextcloud
          group: Applications
          meta_launch_url: https://nextcloud.k8s.internal.smigorx.eu
          provider: !KeyOf nextcloud-provider

  # Uptime Kuma has no OIDC of its own, so unlike every other entry in this
  # ConfigMap this is a proxy provider rather than an OAuth2 one: Traefik asks
  # Authentik about each request before it reaches the app.
  #
  # forward_domain: the login round trip stays on the Authentik host and sets
  # one cookie for the whole k8s.internal.smigorx.eu zone, so Uptime Kuma
  # needs no path in authentik/manifests/outpost-ingress.yaml. Only one
  # provider can own that cookie domain, which is why the arr apps below use
  # forward_single instead.
  #
  # No client secret here: Authentik generates one for proxy providers, so
  # unlike the OAuth2 entries above there is nothing to keep in step with
  # authentik/values.yaml or Vault.
  uptime-kuma.yaml: |
    version: 1
    metadata:
      name: Uptime Kuma forward auth application
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: uptime-kuma-provider
        identifiers:
          name: uptime-kuma
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          external_host: https://auth.k8s.internal.smigorx.eu
          cookie_domain: k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: uptime-kuma-app
        identifiers:
          slug: uptime-kuma
        attrs:
          name: Uptime Kuma
          group: Infrastructure
          meta_launch_url: https://uptime.k8s.internal.smigorx.eu
          provider: !KeyOf uptime-kuma-provider

          # Already the model default, but the bindings below are only an
          # allow-list under "any". Flipped to "all" - which the UI offers as
          # a dropdown on the application - they would instead demand
          # membership of both groups at once, and nobody is in both.
          policy_engine_mode: any

      # Created by hand in the UI, and declared here so that the membership
      # deciding who reaches Uptime Kuma is visible in Git. The user itself
      # stays hand-made on purpose: declaring it would put a password in the
      # repo, so this !Find fails the blueprint if the account is ever
      # renamed or deleted.
      #
      # Like the outpost provider list below, this replaces the membership
      # rather than adding to it - a guest added through the web interface is
      # removed on the next reconcile, so new ones belong in this list.
      - model: authentik_core.group
        identifiers:
          name: guests
        attrs:
          users:
            - !Find [authentik_core.user, [username, Gruzin]]

      # An application without bindings is open to every authenticated user:
      # forward auth would prove only that someone had logged in to
      # Authentik, never that they were entitled to this app in particular.
      # Admins are bound explicitly because a superuser gets no implicit pass
      # once any binding exists.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf uptime-kuma-app
          group: !Find [authentik_core.group, [name, guests]]
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf uptime-kuma-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 1
        attrs:
          enabled: true

  miniflux.yaml: |
    version: 1
    metadata:
      name: Miniflux OIDC application
      labels:
        blueprints.goauthentik.io/description: Miniflux single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: miniflux-provider
        identifiers:
          name: miniflux
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: miniflux
          client_secret: !Env MINIFLUX_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # Miniflux builds this path itself from the provider name, so it is
          # /oauth2/oidc/callback whatever the application is called here.
          redirect_uris:
            - matching_mode: strict
              url: https://miniflux.k8s.internal.smigorx.eu/oauth2/oidc/callback

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # The slug is load-bearing beyond routing: Authentik serves this
      # provider's OIDC discovery document at /application/o/<slug>/, which is
      # exactly what OAUTH2_OIDC_DISCOVERY_ENDPOINT points at. Renaming it
      # breaks discovery, not just the launch link.
      - model: authentik_core.application
        identifiers:
          slug: miniflux
        attrs:
          name: Miniflux
          group: Applications
          meta_launch_url: https://miniflux.k8s.internal.smigorx.eu
          provider: !KeyOf miniflux-provider

  immich.yaml: |
    version: 1
    metadata:
      name: Immich OIDC application
      labels:
        blueprints.goauthentik.io/description: Immich single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        identifiers:
          name: immich
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: immich
          client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # Three, and the custom scheme is not optional: the Android and iOS
          # apps return through app.immich:///oauth-callback and nothing else.
          # Note the three slashes - an empty authority - which is what the app
          # actually sends. /user-settings is for linking an existing Immich
          # account to an Authentik one by hand, which is the escape hatch when
          # the email addresses do not line up.
          redirect_uris:
            - matching_mode: strict
              url: app.immich:///oauth-callback
            - matching_mode: strict
              url: https://immich.k8s.internal.smigorx.eu/auth/login
            - matching_mode: strict
              url: https://immich.k8s.internal.smigorx.eu/user-settings

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Immich reads the discovery document at /application/o/<slug>/, so the
      # slug is what goes into the issuer URL in Immich's own settings.
      - model: authentik_core.application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          group: Media Management
          meta_launch_url: https://immich.k8s.internal.smigorx.eu
          provider: !KeyOf immich-provider

  forgejo.yaml: |
    version: 1
    metadata:
      name: Forgejo OIDC application
      labels:
        blueprints.goauthentik.io/description: Forgejo single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: forgejo-provider
        identifiers:
          name: forgejo
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: forgejo
          client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # Forgejo builds this from the name of the authentication source,
          # which forgejo/values.yaml calls `authentik`. Renaming the source
          # there changes this URL.
          redirect_uris:
            - matching_mode: strict
              url: https://forgejo.k8s.internal.smigorx.eu/user/oauth2/authentik/callback

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # The slug is load-bearing beyond routing: the discovery document
      # forgejo/values.yaml points `autoDiscoverUrl` at is served at
      # /application/o/<slug>/.well-known/openid-configuration.
      - model: authentik_core.application
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          group: Applications
          meta_launch_url: https://forgejo.k8s.internal.smigorx.eu
          provider: !KeyOf forgejo-provider

  # Grafana over the VictoriaMetrics stack in monitoring/. Admins only: the
  # dashboards are every pod, node and Secret-sync failure in the cluster.
  grafana.yaml: |
    version: 1
    metadata:
      name: Grafana OIDC application
      labels:
        blueprints.goauthentik.io/description: Grafana single sign-on configuration

    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # Grafana's generic OAuth callback; the path is fixed, only the host
          # comes from root_url in monitoring/values.yaml.
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.k8s.internal.smigorx.eu/login/generic_oauth

          # profile is what carries the `groups` claim that
          # role_attribute_path in monitoring/values.yaml maps to a role.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # The slug is in the end-session URL monitoring/values.yaml signs out
      # through: /application/o/<slug>/end-session/.
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          group: Infrastructure
          meta_launch_url: https://grafana.k8s.internal.smigorx.eu
          provider: !KeyOf grafana-provider
          policy_engine_mode: any

      # Without a binding every authenticated user - guests included - could
      # complete the login; see uptime-kuma/README.md on how a first binding
      # narrows access. Admins are named explicitly: a superuser gets no
      # implicit pass.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

  # qBittorrent, Prowlarr and Sonarr. Like Uptime Kuma these have no SSO of
  # their own, so they sit behind forward auth - but unlike Uptime Kuma
  # each gets its own provider in forward_single mode.
  #
  # Not domain level: a forward_domain provider claims an entire cookie
  # domain, and a second one claiming the same k8s.internal.smigorx.eu leaves
  # the outpost with no way to tell which application's policies a request for
  # sonarr belongs to. Per-application authorization needs per-application
  # providers.
  #
  # forward_single needs /outpost.goauthentik.io/* to answer on each
  # application's own host; authentik/manifests/outpost-ingress.yaml does that.
  # A new host here needs a rule there and an entry in proxy-outpost.yaml.
  arr-stack.yaml: |
    version: 1
    metadata:
      name: Arr Stack forward auth applications
      labels:
        blueprints.goauthentik.io/description: qBittorrent, Prowlarr and Sonarr forward auth

    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: qbittorrent-provider
        identifiers:
          name: qbittorrent
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://qbittorrent.k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: qbittorrent-app
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          group: Media Management
          meta_launch_url: https://qbittorrent.k8s.internal.smigorx.eu
          provider: !KeyOf qbittorrent-provider

          # Already the model default, but the binding below is only an
          # allow-list under "any". Flipped to "all" it would demand every
          # bound group at once.
          policy_engine_mode: any

      - model: authentik_providers_proxy.proxyprovider
        id: prowlarr-provider
        identifiers:
          name: prowlarr
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://prowlarr.k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: prowlarr-app
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          group: Media Management
          meta_launch_url: https://prowlarr.k8s.internal.smigorx.eu
          provider: !KeyOf prowlarr-provider
          policy_engine_mode: any

      - model: authentik_providers_proxy.proxyprovider
        id: sonarr-provider
        identifiers:
          name: sonarr
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://sonarr.k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: sonarr-app
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          group: Media Management
          meta_launch_url: https://sonarr.k8s.internal.smigorx.eu
          provider: !KeyOf sonarr-provider
          policy_engine_mode: any

      # Admins only, deliberately narrower than Uptime Kuma's guests-and-admins.
      # These three can start downloads, rewrite the library and read every
      # indexer credential in Prowlarr; a status page they are not.
      #
      # An application with no bindings at all is open to every authenticated
      # user, so each of the three needs its own - there is no inheritance and a
      # superuser gets no implicit pass.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf qbittorrent-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf prowlarr-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf sonarr-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

  # Radarr has had its own OIDC login since v7, so unlike its neighbours in
  # arr-stack.yaml it is an ordinary OAuth2 client rather than forward auth.
  # Its settings are environment variables in
  # arr-stack/manifests/radarr/deployment.yaml.
  radarr.yaml: |
    version: 1
    metadata:
      name: Radarr OIDC application
      labels:
        blueprints.goauthentik.io/description: Radarr single sign-on configuration

    entries:
      # The forward_single provider Radarr used to sit behind. It goes first:
      # a proxy provider is an OAuth2 provider underneath and provider names
      # are unique, so while it exists the entry below would find it and
      # rewrite it in place instead of creating a real OAuth2 one. A no-op
      # once it is gone.
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: radarr

      - model: authentik_providers_oauth2.oauth2provider
        id: radarr-provider
        identifiers:
          name: radarr
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

          client_type: confidential
          client_id: radarr
          client_secret: !Env RADARR_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token

          # ASP.NET's default OIDC callback and signed-out paths; Radarr sets
          # neither. Only right while Radarr trusts Traefik's
          # X-Forwarded-Proto (TrustedNetworks in the Deployment), or it
          # sends http:// here.
          redirect_uris:
            - matching_mode: strict
              url: https://radarr.k8s.internal.smigorx.eu/signin-oidc
            - matching_mode: strict
              url: https://radarr.k8s.internal.smigorx.eu/signout-callback-oidc

          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]

          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # The slug is in the authority URL the Deployment points at:
      # /application/o/<slug>/.
      - model: authentik_core.application
        id: radarr-app
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          group: Media Management
          meta_launch_url: https://radarr.k8s.internal.smigorx.eu
          provider: !KeyOf radarr-provider
          policy_engine_mode: any

      # Radarr itself admits a single `sub`, akadmin's. This binding is the
      # other lock: anyone else is refused at Authentik rather than at
      # Radarr's "not authorized" page.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf radarr-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

  # Alertmanager has no authentication of its own, and its UI can silence any
  # alert, so forward auth, admins only. forward_single for the same reason as
  # the arr apps above: the domain level cookie already belongs to Uptime
  # Kuma. Its /outpost.goauthentik.io path is in
  # authentik/manifests/outpost-ingress.yaml, its Middleware in
  # monitoring/manifests/middleware.yaml.
  alertmanager.yaml: |
    version: 1
    metadata:
      name: Alertmanager forward auth application
      labels:
        blueprints.goauthentik.io/description: Alertmanager forward auth

    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: alertmanager-provider
        identifiers:
          name: alertmanager
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://alertmanager.k8s.internal.smigorx.eu

      - model: authentik_core.application
        id: alertmanager-app
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          group: Infrastructure
          meta_launch_url: https://alertmanager.k8s.internal.smigorx.eu
          provider: !KeyOf alertmanager-provider
          policy_engine_mode: any

      # Without a binding every authenticated user could get in; a superuser
      # gets no implicit pass once one exists.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf alertmanager-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
          order: 0
        attrs:
          enabled: true

  # The embedded outpost only proxies providers explicitly assigned to it, and
  # the assignment replaces the list rather than adding to it. That makes it
  # one blueprint's job to name all of them, in its own key: left in
  # uptime-kuma.yaml or arr-stack.yaml, whichever reconciled last would evict
  # the other's providers, and !KeyOf cannot reach an id in another blueprint
  # anyway - hence !Find by name throughout.
  #
  # Every future forward auth provider belongs in this list too. One missing
  # entry does not error; the outpost simply stops answering for that host and
  # the app 404s at the login round trip.
  proxy-outpost.yaml: |
    version: 1
    metadata:
      name: Embedded proxy outpost provider assignment
      labels:
        blueprints.goauthentik.io/description: Every proxy provider the embedded outpost serves

    entries:
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, uptime-kuma]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, qbittorrent]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, prowlarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, alertmanager]]
