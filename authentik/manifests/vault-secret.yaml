# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
#
# The `authentik` Secret is NOT here: the authentik Helm chart owns it
# (app.kubernetes.io/managed-by: Helm).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-app
spec:
  type: kv-v2
  mount: secret
  path: authentik/app
  refreshAfter: 1h
  destination:
    name: authentik-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# Provider-side halves of the OIDC client secrets, one <app>-client-secret
# key per confidential client. Each must stay equal to the copy the app itself
# reads, usually secret/<app>/oidc (Vault's is its own OIDC auth config).
# authentik/values.yaml turns each key into the variable its blueprint reads.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-oidc
spec:
  type: kv-v2
  mount: secret
  path: authentik/oidc
  refreshAfter: 1h
  destination:
    name: authentik-oidc-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
