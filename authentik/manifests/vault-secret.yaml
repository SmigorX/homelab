# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
#
# The `authentik` Secret is NOT here: the authentik Helm chart owns it
# (app.kubernetes.io/managed-by: Helm).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-app
spec:
  type: kv-v2
  mount: secret
  path: authentik/app
  refreshAfter: 1h
  destination:
    name: authentik-secrets
    create: true
    overwrite: true
---
# Provider-side halves of the OIDC client secrets. Each key must stay equal to
# its consumer-side copy: paperless-client-secret -> paperless/oidc,
# yamtrack-client-secret -> yamtrack/oidc, vault-client-secret -> Vault's own
# OIDC registration.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-oidc
spec:
  type: kv-v2
  mount: secret
  path: authentik/oidc
  refreshAfter: 1h
  destination:
    name: authentik-oidc-secrets
    create: true
    overwrite: true
