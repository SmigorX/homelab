# Trimmed from the upstream chart defaults: https://github.com/hashicorp/vault-secrets-operator/blob/main/chart/values.yaml
# Anything not listed here just falls back to that file's default.

controller:
  manager:
    image:
      repository: hashicorp/vault-secrets-operator
      tag: "1.5.1"

# Deploys a VaultConnection CR named "default" so individual VaultAuth/
# VaultStaticSecret/etc. CRs don't each need to repeat the Vault address.
defaultVaultConnection:
  enabled: true
  address: http://vault.vault.svc.cluster.local:8200

# Deploys a VaultAuth CR named "default" so secret CRs can omit vaultAuthRef.
# Vault itself must have the kubernetes auth method enabled and this role
# created before this actually authenticates successfully — see
# vault/README.md for the one-time bootstrap steps.
defaultAuthMethod:
  enabled: true
  # Chart renders this unquoted; a plain "" collapses to null and the CRD
  # rejects it. The literal quotes force a real empty string.
  namespace: '""'
  allowedNamespaces: ["*"]   # required: consumers live outside this namespace
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: default
    serviceAccount: default

# The chart's defaults carry a 500m CPU limit on both containers. Requests are
# close enough to reality to keep; the limits are the part that does not belong
# on a single-node cluster, where throttling protects nobody.
#
# `cpu: null` rather than simply leaving it out: Helm deep-merges values, so an
# omitted key keeps the chart's default. Null is what deletes it.
controller:
  manager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: null
        memory: 128Mi

  kubeRbacProxy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: null
        memory: 128Mi
