# Mounted read-only at /config/configuration.yaml. This is safe because Home
# Assistant never writes this file: everything added through the UI lands in
# /config/.storage instead. The catch is that subPath mounts do not hot-update,
# so a change here needs a pod restart to take effect.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
  namespace: home-automation
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      name: Home
      time_zone: Europe/Warsaw
      external_url: https://home-assistant.k8s.internal.smigorx.eu
      internal_url: https://home-assistant.k8s.internal.smigorx.eu

    # No `http:` block here on purpose. Home Assistant has deprecated HTTP
    # configuration in YAML: it imports the block once as an unconfirmed
    # "pending" trial, reverts to the stable config after five minutes if
    # nobody promotes it, and ignores the YAML from then on. On a fresh
    # install nobody *can* promote it, because promotion needs a logged-in
    # UI session and onboarding has not happened yet. The reverse-proxy
    # settings therefore live in the UI, under
    # Settings -> System -> Network. See the README.

    recorder:
      # !env_var is not on the Home Assistant secrets documentation page, but it
      # is registered by annotatedyaml, the loader Home Assistant delegates to.
      # It is how the Postgres password stays out of this ConfigMap.
      db_url: !env_var HA_DB_URL
      purge_keep_days: 365

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
