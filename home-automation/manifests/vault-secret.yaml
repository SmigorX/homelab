# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
#
# home-assistant-postgres-app is deliberately NOT here. Unlike paperless and
# nextcloud, the CloudNativePG Cluster omits `bootstrap.initdb.secret`, so the
# operator generates that Secret itself and owns the password. Adding a
# VaultStaticSecret for it would fight the operator over the same object.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mqtt
spec:
  type: kv-v2
  mount: secret
  path: home-automation/mqtt
  refreshAfter: 1h
  destination:
    name: mqtt-credentials
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The Zigbee2MQTT frontend ships with no authentication at all, and this one is
# published on an Ingress. The token is what stands between the LAN and a
# "permit join" button.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zigbee2mqtt
spec:
  type: kv-v2
  mount: secret
  path: home-automation/zigbee2mqtt
  refreshAfter: 1h
  destination:
    name: zigbee2mqtt-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
