# Uptime Kuma has no OIDC of its own (louislam/uptime-kuma#5589 is still
# open), so the only way to put it behind Authentik is forward auth: Traefik
# asks Authentik about every request before it reaches the app.
#
# The provider behind it runs in forward_domain ("domain level") mode, which
# keeps the whole login round trip on auth.k8s.internal.smigorx.eu. See
# uptime-kuma/README.md for why, and arr-stack/manifests/middleware.yaml for
# the per-application alternative.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: uptime-kuma
spec:
  forwardAuth:
    # The embedded outpost, served by authentik-server itself - there is no
    # separate outpost Deployment to run.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik

    # Traefik already sits at the edge, so the X-Forwarded-* it sends are the
    # real ones and Authentik needs to trust them to build the redirect back.
    trustForwardHeader: true

    # Passed through to the app. Uptime Kuma ignores them, but they are what
    # makes this middleware reusable for something that can consume a
    # trusted-header identity.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
