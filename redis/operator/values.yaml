redisOperator:
  name: redis-operator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  serviceDNSDomain: "cluster.local"

  pprof:
    enabled: false
    bindAddress: ":6060"

  metrics:
    enabled: false
    bindAddress: ":8080"

resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 500m
    memory: 500Mi

replicas: 1

priorityClassName: ""
tolerateAllTaints: false
tolerations: []

manager:
  # config values for the operator manager
  config:
    kubeClientTimeout: 60s
    # -- If value > 0, it will override the default value in the operator
    kubeClientQPS: 0.0
    # Set to 0 to use the operator's built-in default.
    maxConcurrentReconciles: 3
    # Accepts a Go duration (e.g. "30s", "5m"). Empty uses the operator's built-in default.
    execCommandTimeout: ""
