frrk8s:
  enabled: false

# The chart ships no resources.
# No CPU limits anywhere in this cluster: one node, nothing to protect other
# tenants from, and throttling the network layer is its own kind of outage.
controller:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

speaker:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
