frrk8s:
  enabled: false

# The chart ships none, which left both components invisible to the scheduler
# on a node where CPU requests, not CPU usage, are what runs out.
# No CPU limits anywhere in this cluster: one node, nothing to protect other
# tenants from, and throttling the network layer is its own kind of outage.
controller:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

speaker:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
