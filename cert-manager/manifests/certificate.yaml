apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-internal
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: wildcard-k8s-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.internal.smigorx.eu"
    - "k8s.internal.smigorx.eu"
    - "*.internal.smigorx.eu"
    - "internal.smigorx.eu"
    

---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  defaultCertificate:
    secretName: wildcard-k8s-internal-tls