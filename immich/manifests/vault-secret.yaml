# Synced from Vault by the Vault Secrets Operator.
# vaultAuthRef/vaultConnectionRef are intentionally omitted: VSO falls back to
# the cluster-wide "default" VaultAuth/VaultConnection in the operator's
# namespace. See vault/README.md.
#
# immich-postgres-ca is deliberately NOT here: it is owned by the
# CloudNativePG Cluster/immich-postgres and regenerated by the operator.
#
# There is no OIDC entry here: Immich keeps its OAuth settings in its database,
# not in a Secret, and the client secret lives only at secret/authentik/oidc.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-postgres
spec:
  type: kv-v2
  mount: secret
  path: immich/postgres
  refreshAfter: 1h
  destination:
    name: immich-postgres-app
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
