# The nextcloud image runs every executable *.sh in
# /docker-entrypoint-hooks.d/before-starting on each container start, as
# www-data with cwd /var/www/html. That is the only hook that runs after
# both first install and every upgrade, which is what makes this the right
# place to converge post-install configuration.
#
# The script is idempotent: `user_oidc:provider <identifier>` creates the
# provider if absent and updates it in place if present.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-hooks
  namespace: nextcloud
data:
  00-system.sh: |
    #!/bin/sh
    set -eu

    # NEXTCLOUD_TRUSTED_DOMAINS is only read by the entrypoint during the
    # initial install, so converge it here as well - otherwise adding a
    # domain later silently does nothing.
    idx=1
    for domain in ${NEXTCLOUD_TRUSTED_DOMAINS}; do
      php occ config:system:set trusted_domains "$idx" --value="$domain"
      idx=$((idx + 1))
    done

    # Nextcloud's LocalAddressChecker refuses any server-side HTTP request to
    # a private address, failing with "violates local access rules". Both
    # integrations here are local by design - Authentik on the LAN and the
    # Document Server on a ClusterIP - so this has to be on or neither works.
    #
    # It does widen SSRF surface (link previews, federated sharing can now be
    # pointed at internal hosts), which is the accepted trade for running an
    # IdP that has no public address.
    php occ config:system:set allow_local_remote_servers --value=true --type=boolean
  20-onlyoffice.sh: |
    #!/bin/sh
    set -eu

    if ! php occ app:getpath onlyoffice >/dev/null 2>&1; then
      echo "==> installing onlyoffice connector"
      php occ app:install --keep-disabled onlyoffice
    fi
    php occ app:enable onlyoffice

    echo "==> converging Document Server config"
    php occ config:app:set onlyoffice DocumentServerUrl --value="${ONLYOFFICE_URL}"
    php occ config:app:set onlyoffice DocumentServerInternalUrl --value="${ONLYOFFICE_INTERNAL_URL}"
    php occ config:app:set onlyoffice StorageUrl --value="${NEXTCLOUD_STORAGE_URL}"
    php occ config:app:set onlyoffice jwt_secret --value="${ONLYOFFICE_JWT_SECRET}"

    # Must match JWT_HEADER on the Document Server deployment.
    php occ config:app:set onlyoffice jwt_header --value=Authorization

    # Reports the handshake in the pod log. Deliberately non-fatal: a
    # Document Server that is briefly down must not block Nextcloud starting.
    php occ onlyoffice:documentserver --check || \
      echo "==> WARNING: Document Server check failed, see occ output above"
  10-authentik-oidc.sh: |
    #!/bin/sh
    set -eu

    # app:install fails if the app is already present, so only install once.
    if ! php occ app:getpath user_oidc >/dev/null 2>&1; then
      echo "==> installing user_oidc"
      php occ app:install --keep-disabled user_oidc
    fi
    php occ app:enable user_oidc

    # Background jobs are driven by the CronJob in cron.yaml, so switch off
    # the default AJAX cron (which only fires while someone has a page open).
    php occ background:cron

    # --clientsecret-env keeps the secret out of the process list; the flag
    # takes the NAME of the variable, not its value.
    echo "==> converging Authentik OIDC provider"
    php occ user_oidc:provider authentik \
      --clientid="${NEXTCLOUD_OIDC_CLIENT_ID}" \
      --clientsecret-env=NEXTCLOUD_OIDC_CLIENT_SECRET \
      --discoveryuri="${NEXTCLOUD_OIDC_DISCOVERY_URI}" \
      --scope="openid profile email" \
      --unique-uid=0 \
      --mapping-uid=preferred_username \
      --mapping-display-name=name \
      --mapping-email=email \
      --mapping-groups=groups \
      --group-provisioning=1 \
      --group-whitelist-regex='^admin$'
