apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1

  # The data PVC is ReadWriteOnce on local-path, so never run two pods at
  # once against it.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: nextcloud

  template:
    metadata:
      labels:
        app: nextcloud

    spec:
      enableServiceLinks: false
      containers:
        - name: nextcloud
          image: nextcloud:34.0.3-apache

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          ports:
            - name: http
              containerPort: 80

          env:
            # PostgreSQL
            - name: POSTGRES_HOST
              value: nextcloud-postgres-rw

            - name: POSTGRES_DB
              value: nextcloud

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-postgres-app
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-postgres-app
                  key: password

            # Valkey
            - name: REDIS_HOST
              value: nextcloud-valkey

            - name: REDIS_HOST_PORT
              value: "6379"

            # First-run administrator. Ignored once installed.
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: admin-user

            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: admin-password

            # Behind Traefik: TLS terminates at the ingress, so Nextcloud has
            # to be told the public scheme/host or it builds http:// URLs and
            # OIDC redirects break.
            # Space separated. The in-cluster name is here because the
            # Document Server calls back to Nextcloud over StorageUrl, and
            # Nextcloud rejects any Host not on this list. Only applied at
            # install time, so 00-trusted-domains.sh converges it too.
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.k8s.internal.smigorx.eu nextcloud.nextcloud.svc.cluster.local

            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16

            - name: OVERWRITEPROTOCOL
              value: https

            - name: OVERWRITEHOST
              value: nextcloud.k8s.internal.smigorx.eu

            - name: OVERWRITECLIURL
              value: https://nextcloud.k8s.internal.smigorx.eu

            - name: PHP_MEMORY_LIMIT
              value: 512M

            - name: PHP_UPLOAD_LIMIT
              value: 10G

            # OIDC / Authentik - consumed by the before-starting hook.
            - name: NEXTCLOUD_OIDC_CLIENT_ID
              value: nextcloud

            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-oidc
                  key: client-secret

            - name: NEXTCLOUD_OIDC_DISCOVERY_URI
              value: https://auth.k8s.internal.smigorx.eu/application/o/nextcloud/.well-known/openid-configuration

            # OnlyOffice - consumed by the before-starting hook.
            # Browser-facing, so it must be the public URL. Trailing slashes
            # matter: the app's setters normalise them, but occ
            # config:app:set writes the raw value straight past them.
            - name: ONLYOFFICE_URL
              value: https://onlyoffice.k8s.internal.smigorx.eu/

            # Nextcloud -> Document Server, stays inside the cluster.
            - name: ONLYOFFICE_INTERNAL_URL
              value: http://onlyoffice-docs.onlyoffice-docs.svc.cluster.local/

            # Document Server -> Nextcloud, likewise internal.
            - name: NEXTCLOUD_STORAGE_URL
              value: http://nextcloud.nextcloud.svc.cluster.local/

            - name: ONLYOFFICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-onlyoffice
                  key: JWT_SECRET

          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html

            - name: hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting

          # First install plus the OIDC hook runs before Apache listens, so
          # allow a generous startup window before liveness takes over.
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.k8s.internal.smigorx.eu
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: nextcloud.k8s.internal.smigorx.eu
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20

      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data

        - name: hooks
          configMap:
            name: nextcloud-hooks
            # run_path skips any hook script without the executable bit.
            defaultMode: 0755
