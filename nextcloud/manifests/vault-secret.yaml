# Synced from Vault by the Vault Secrets Operator. See vault/README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-postgres
spec:
  type: kv-v2
  mount: secret
  path: nextcloud/postgres
  refreshAfter: 1h
  destination:
    name: nextcloud-postgres-app
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-app
spec:
  type: kv-v2
  mount: secret
  path: nextcloud/app
  refreshAfter: 1h
  destination:
    name: nextcloud-secrets
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# client-secret must stay equal to
# authentik-oidc-secrets/nextcloud-client-secret in the authentik namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-oidc
spec:
  type: kv-v2
  mount: secret
  path: nextcloud/oidc
  refreshAfter: 1h
  destination:
    name: nextcloud-oidc
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
# The Document Server's JWT secret. Vault is the source of truth, so Nextcloud
# reads the very same path the onlyoffice-docs namespace does rather than
# keeping a hand-copied duplicate in sync. Rotating it in Vault updates both.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nextcloud-onlyoffice
spec:
  type: kv-v2
  mount: secret
  path: onlyoffice-docs/jwt
  refreshAfter: 1h
  destination:
    name: nextcloud-onlyoffice
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
