# Nextcloud's background jobs. Without this, occ background:cron has nothing
# driving it and maintenance tasks silently never run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false

          # Overriding command: bypasses the image entrypoint, which is what
          # normally drops to www-data. Nextcloud's console refuses to run as
          # anyone but the owner of config/config.php, so run as uid 33
          # directly or every job dies with "Console has to be executed with
          # the user that owns the file config/config.php".
          securityContext:
            runAsUser: 33
            runAsGroup: 33

          containers:
            - name: cron
              image: nextcloud:34.0.3-apache
              command: ["php", "-f", "/var/www/html/cron.php"]

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi

              volumeMounts:
                - name: nextcloud-data
                  mountPath: /var/www/html

          volumes:
            - name: nextcloud-data
              persistentVolumeClaim:
                claimName: nextcloud-data
